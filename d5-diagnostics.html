<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D5 Log Diagnostics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .header p { font-size: 14px; color: #888; }
    .dropzone { border: 2px dashed #444; border-radius: 12px; padding: 48px; text-align: center; cursor: pointer; background: #222; transition: all 0.2s; margin-bottom: 24px; }
    .dropzone.active { border-color: #4a9eff; background: rgba(74,158,255,0.05); }
    .dropzone .main-text { font-size: 16px; color: #aaa; margin-bottom: 8px; }
    .dropzone .hint { font-size: 12px; color: #666; }
    .card { background: #2a2a2e; border-radius: 8px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .card-title { font-size: 14px; font-weight: 600; color: #ccc; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .stat-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat-box { background: #222; border-radius: 8px; padding: 12px; min-width: 100px; flex: 1; text-align: center; }
    .stat-box .value { font-size: 24px; font-weight: 700; color: #fff; }
    .stat-box .label { font-size: 12px; color: #888; margin-top: 2px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 12px; color: #000; font-weight: 700; font-size: 13px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 4px; }
    .summary-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .summary-left { display: flex; align-items: center; gap: 12px; }
    .summary-right { display: flex; gap: 12px; align-items: center; }
    .summary-info { font-size: 13px; color: #888; }
    .tab-bar { display: flex; gap: 4px; border-bottom: 1px solid #333; margin-bottom: 16px; }
    .tab-bar button { padding: 8px 16px; border: none; border-bottom: 2px solid transparent; background: none; color: #888; cursor: pointer; font-weight: 600; font-size: 13px; }
    .tab-bar button.active { color: #fff; border-bottom-color: #4a9eff; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-sec { background: #444; color: #ccc; }
    .btn-sec:hover { background: #555; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #444; color: #888; font-weight: 600; }
    td { padding: 6px 8px; border-bottom: 1px solid #333; color: #ccc; word-break: break-word; }
    td.ts { white-space: nowrap; color: #888; }
    pre.log { background: #1a1a1e; padding: 12px; border-radius: 6px; overflow: auto; font-size: 12px; color: #aaa; max-height: 200px; white-space: pre-wrap; word-break: break-word; }
    .error-line { font-size: 12px; color: #ccc; padding: 4px 0; border-bottom: 1px solid #333; }
    .error-line .ts { color: #888; margin-right: 8px; }
    .error-msg { color: #ff8888; font-size: 13px; text-align: center; margin-top: 12px; }
    .loading { text-align: center; padding: 48px; color: #888; }
    .loading .title { font-size: 18px; margin-bottom: 8px; }
    .loading .sub { font-size: 13px; }
    .crash-type { font-size: 13px; color: #ff8888; font-weight: 600; }
    .crash-msg { font-size: 12px; color: #ccc; margin: 4px 0; }
    .crash-item { margin-bottom: 12px; }
    .top-actions { margin-bottom: 16px; text-align: right; }
    .hidden { display: none; }
    .file-info { font-size: 14px; color: #ccc; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <h1>D5 Log Diagnostics</h1>
      <p>Drop a zip or log files to analyze crashes, errors, memory, and network issues</p>
    </div>
    <div id="upload-section">
      <div class="dropzone" id="dropzone">
        <div class="main-text">Drag &amp; drop log files or zip archives</div>
        <div class="hint">.zip, .log, .txt, .out, .err, .crash, .dump, .trace</div>
        <input type="file" id="file-input" multiple accept=".zip,.log,.txt,.out,.err,.crash,.dump,.trace" style="display:none" />
      </div>
      <div id="error-msg" class="error-msg hidden"></div>
    </div>
    <div id="loading-section" class="loading hidden">
      <div class="title">Analyzing logs...</div>
      <div class="sub">Parsing files and detecting issues</div>
    </div>
    <div id="report-section" class="hidden"></div>
  </div>

<script>
"use strict";

// ─── Minimal Zip Reader (handles standard ZIP with deflate/stored) ──────────

var MiniZip = (function() {
  function readUint16(buf, off) { return buf[off] | (buf[off+1] << 8); }
  function readUint32(buf, off) { return (buf[off] | (buf[off+1] << 8) | (buf[off+2] << 16) | (buf[off+3] << 24)) >>> 0; }

  function inflate(data) {
    var ds = new DecompressionStream('deflate-raw');
    var writer = ds.writable.getWriter();
    writer.write(data);
    writer.close();
    var reader = ds.readable.getReader();
    var chunks = [];
    return (function read() {
      return reader.read().then(function(result) {
        if (result.done) {
          var total = 0;
          chunks.forEach(function(c) { total += c.length; });
          var out = new Uint8Array(total);
          var off = 0;
          chunks.forEach(function(c) { out.set(c, off); off += c.length; });
          return out;
        }
        chunks.push(result.value);
        return read();
      });
    })();
  }

  function parseEntries(buffer) {
    var buf = new Uint8Array(buffer);
    var entries = [];
    // Find end of central directory
    var eocdOff = -1;
    for (var i = buf.length - 22; i >= 0; i--) {
      if (readUint32(buf, i) === 0x06054b50) { eocdOff = i; break; }
    }
    if (eocdOff < 0) throw new Error('Not a valid ZIP file');

    var cdOffset = readUint32(buf, eocdOff + 16);
    var cdCount = readUint16(buf, eocdOff + 10);
    var off = cdOffset;

    for (var n = 0; n < cdCount; n++) {
      if (readUint32(buf, off) !== 0x02014b50) break;
      var method = readUint16(buf, off + 10);
      var compSize = readUint32(buf, off + 20);
      var uncompSize = readUint32(buf, off + 24);
      var nameLen = readUint16(buf, off + 28);
      var extraLen = readUint16(buf, off + 30);
      var commentLen = readUint16(buf, off + 32);
      var localOff = readUint32(buf, off + 42);
      var name = new TextDecoder().decode(buf.slice(off + 46, off + 46 + nameLen));
      entries.push({ name: name, method: method, compSize: compSize, uncompSize: uncompSize, localOff: localOff });
      off += 46 + nameLen + extraLen + commentLen;
    }
    return { entries: entries, buf: buf };
  }

  function extractEntry(zip, entry) {
    var buf = zip.buf;
    var off = entry.localOff;
    if (readUint32(buf, off) !== 0x04034b50) throw new Error('Invalid local header');
    var nameLen = readUint16(buf, off + 26);
    var extraLen = readUint16(buf, off + 28);
    var dataStart = off + 30 + nameLen + extraLen;
    var raw = buf.slice(dataStart, dataStart + entry.compSize);

    if (entry.method === 0) {
      return Promise.resolve(new TextDecoder().decode(raw));
    } else if (entry.method === 8) {
      return inflate(raw).then(function(decompressed) {
        return new TextDecoder().decode(decompressed);
      });
    } else {
      return Promise.reject(new Error('Unsupported compression method: ' + entry.method));
    }
  }

  return {
    load: function(file) {
      return file.arrayBuffer().then(function(buffer) {
        return parseEntries(buffer);
      });
    },
    extract: extractEntry
  };
})();

// ─── Parsers ────────────────────────────────────────────────────────────────

function parseCrashLog(text) {
  var lines = text.split('\n');
  var crashes = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var tsMatch = line.match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})/);
    if (/\b(FATAL|CRASH|Exception|Error|SIGSEGV|SIGABRT|panic|Traceback)\b/i.test(line)) {
      current = {
        timestamp: tsMatch ? tsMatch[1] : null,
        type: (line.match(/\b(FATAL|CRASH|SIGSEGV|SIGABRT|panic|Exception|Error)\b/i) || ['Unknown'])[0],
        message: line.trim(),
        stack: []
      };
      crashes.push(current);
    } else if (current && /^\s+(at |#\d|frame|0x|\.\.\.)/.test(line)) {
      current.stack.push(line.trim());
    } else if (current && line.trim() === '') {
      current = null;
    }
  }
  return crashes;
}

function parseSystemLog(text) {
  var lines = text.split('\n');
  var entries = [];
  var severityCounts = { ERROR: 0, WARN: 0, INFO: 0, DEBUG: 0 };
  for (var i = 0; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    var match = lines[i].match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2}[^\s]*)\s+\[?(ERROR|WARN|WARNING|INFO|DEBUG)\]?\s*(.*)/i);
    if (match) {
      var sev = match[2].toUpperCase().startsWith('WARN') ? 'WARN' : match[2].toUpperCase();
      if (severityCounts[sev] !== undefined) severityCounts[sev]++;
      entries.push({ timestamp: match[1], severity: sev, message: match[3].trim() });
    }
  }
  return { entries: entries, severityCounts: severityCounts, total: entries.length };
}

function parseMemoryLog(text) {
  var lines = text.split('\n');
  var dataPoints = [];
  var peakUsage = 0;
  for (var i = 0; i < lines.length; i++) {
    var match = lines[i].match(/(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})[^\d]*(\d+(?:\.\d+)?)\s*(MB|GB|KB|bytes)/i);
    if (match) {
      var val = parseFloat(match[2]);
      var u = match[3].toUpperCase();
      if (u === 'GB') val *= 1024;
      else if (u === 'KB') val /= 1024;
      else if (u === 'BYTES') val /= (1024 * 1024);
      if (val > peakUsage) peakUsage = val;
      dataPoints.push({ timestamp: match[1], valueMB: val });
    }
  }
  var oomEvents = (text.match(/\b(OOM|OutOfMemory|out of memory|oom-killer)\b/gi) || []).length;
  return { dataPoints: dataPoints, peakUsage: Math.round(peakUsage), oomEvents: oomEvents };
}

function parseNetworkLog(text) {
  var lines = text.split('\n');
  var errors = [];
  var timeouts = 0, connectionRefused = 0, dnsFailures = 0;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/timeout/i.test(line)) timeouts++;
    if (/connection refused/i.test(line)) connectionRefused++;
    if (/dns|resolve|NXDOMAIN/i.test(line)) dnsFailures++;
    if (/\b(error|fail|timeout|refused|unreachable)\b/i.test(line)) {
      var tsMatch = line.match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})/);
      errors.push({ timestamp: tsMatch ? tsMatch[1] : null, message: line.trim().slice(0, 200) });
    }
  }
  return { errors: errors.slice(0, 100), timeouts: timeouts, connectionRefused: connectionRefused, dnsFailures: dnsFailures };
}

function parseGenericLog(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  var errors = 0, warnings = 0;
  var errorLines = [];
  for (var i = 0; i < lines.length; i++) {
    if (/\berror\b/i.test(lines[i])) { errors++; errorLines.push(lines[i].trim().slice(0, 200)); }
    if (/\bwarn(ing)?\b/i.test(lines[i])) warnings++;
  }
  return { totalLines: lines.length, errors: errors, warnings: warnings, sampleErrors: errorLines.slice(0, 20) };
}

function classifyFile(name, content) {
  var lower = name.toLowerCase();
  var sample = content.slice(0, 4000);

  // Content-based detection first (most reliable)
  if (/\b(FATAL|CRASH|SIGSEGV|SIGABRT|panic|Traceback)\b/i.test(sample)) return 'crash';
  if (/\b(OOM|OutOfMemory|out of memory|oom-killer)\b/i.test(sample)) return 'memory';

  // Filename hints, but only if content looks like a log (has timestamps or severity levels)
  var looksLikeLog = /\d{4}-\d{2}-\d{2}|\b(ERROR|WARN|INFO|DEBUG|FATAL)\b/i.test(sample);

  if (looksLikeLog) {
    if (/crash|fatal|panic/i.test(lower)) return 'crash';
    if (/memory|mem|heap|oom/i.test(lower)) return 'memory';
    if (/network|net|conn|http/i.test(lower)) return 'network';
    if (/system|syslog|main/i.test(lower)) return 'system';
  }

  // Fallback: check if it has structured log lines
  if (/^\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2}.*\b(ERROR|WARN|INFO|DEBUG)\b/im.test(sample)) return 'system';

  return 'generic';
}

function parseFile(name, content) {
  var type = classifyFile(name, content);
  var parsed;
  switch (type) {
    case 'crash':
      parsed = parseCrashLog(content);
      // If classified as crash but nothing found, fall back to generic
      if (parsed.length === 0) return { type: 'generic', data: parseGenericLog(content) };
      return { type: 'crash', data: parsed };
    case 'system': return { type: 'system', data: parseSystemLog(content) };
    case 'memory': return { type: 'memory', data: parseMemoryLog(content) };
    case 'network': return { type: 'network', data: parseNetworkLog(content) };
    default: return { type: 'generic', data: parseGenericLog(content) };
  }
}

function isLogFile(path) {
  // Exclude config/binary files even if path contains "log" or "crash"
  if (/\.(ini|cfg|config|dmp|exe|dll|pdb|xml|json|png|jpg|dat|db|bin)$/i.test(path)) return false;
  return /\.(log|txt|out|err|crash|trace|csv)$/i.test(path) || /log/i.test(path);
}

function processZip(file) {
  return MiniZip.load(file).then(function(zip) {
    var promises = [];
    zip.entries.forEach(function(entry) {
      if (entry.name.endsWith('/')) return;
      if (!isLogFile(entry.name)) return;
      promises.push(
        MiniZip.extract(zip, entry).then(function(content) {
          if (!content.trim()) return null;
          var parsed = parseFile(entry.name, content);
          return { path: entry.name, size: content.length, type: parsed.type, data: parsed.data };
        }).catch(function(e) {
          return { path: entry.name, type: 'error', data: { error: e.message } };
        })
      );
    });
    return Promise.all(promises).then(function(results) {
      return results.filter(function(r) { return r !== null; });
    });
  });
}

function processSingleFile(file) {
  return file.text().then(function(content) {
    if (!content.trim()) return [];
    var parsed = parseFile(file.name, content);
    return [{ path: file.name, size: content.length, type: parsed.type, data: parsed.data }];
  });
}

// ─── Severity / Report ──────────────────────────────────────────────────────

function getSeverity(results) {
  var hasCrashes = results.some(function(r) { return r.type === 'crash' && r.data.length > 0; });
  var hasOOM = results.some(function(r) { return r.type === 'memory' && r.data.oomEvents > 0; });
  var totalErrors = results.reduce(function(sum, r) {
    if (r.type === 'system') return sum + r.data.severityCounts.ERROR;
    if (r.type === 'generic') return sum + r.data.errors;
    if (r.type === 'network') return sum + r.data.errors.length;
    return sum;
  }, 0);
  if (hasCrashes || hasOOM) return { level: 'critical', color: '#ff4444', label: 'Critical' };
  if (totalErrors > 10) return { level: 'high', color: '#ff8c00', label: 'High' };
  if (totalErrors > 0) return { level: 'medium', color: '#ffd700', label: 'Medium' };
  return { level: 'low', color: '#44cc44', label: 'Low' };
}

function detectUsername(results) {
  var candidates = {};
  var patterns = [
    /\/home\/([a-zA-Z0-9._-]+)\//g,
    /C:\\Users\\([a-zA-Z0-9._-]+)\\/gi,
    /\/Users\/([a-zA-Z0-9._-]+)\//g,
    /\buser[=: ]+([a-zA-Z0-9._-]+)/gi,
    /\busername[=: ]+([a-zA-Z0-9._-]+)/gi,
    /\blogged in as ([a-zA-Z0-9._-]+)/gi,
    /\bsession for ([a-zA-Z0-9._-]+)/gi
  ];
  var ignore = {root:1, system:1, admin:1, nobody:1, daemon:1, lib:1, bin:1, local:1, share:1, tmp:1, var:1, etc:1, default:1, public:1, '':1};

  results.forEach(function(f) {
    if (f.type === 'error') return;
    // Check file paths inside zip for /home/user/ patterns
    patterns.slice(0, 3).forEach(function(pat) {
      var m;
      pat.lastIndex = 0;
      while ((m = pat.exec(f.path)) !== null) {
        var name = m[1].toLowerCase();
        if (!ignore[name]) candidates[name] = (candidates[name] || 0) + 5;
      }
    });
  });

  // Sample content from results - check parsed messages for username hints
  results.forEach(function(f) {
    var text = '';
    if (f.type === 'crash') {
      f.data.forEach(function(c) { text += c.message + '\n' + c.stack.join('\n') + '\n'; });
    } else if (f.type === 'system') {
      f.data.entries.slice(0, 50).forEach(function(e) { text += e.message + '\n'; });
    } else if (f.type === 'network') {
      f.data.errors.slice(0, 50).forEach(function(e) { text += e.message + '\n'; });
    } else if (f.type === 'generic') {
      text = f.data.sampleErrors.join('\n');
    }

    patterns.forEach(function(pat) {
      var m;
      pat.lastIndex = 0;
      while ((m = pat.exec(text)) !== null) {
        var name = m[1].toLowerCase();
        if (!ignore[name]) candidates[name] = (candidates[name] || 0) + 1;
      }
    });
  });

  var best = null, bestCount = 0;
  Object.keys(candidates).forEach(function(name) {
    if (candidates[name] > bestCount) { best = name; bestCount = candidates[name]; }
  });
  return best;
}

function computeTotals(results) {
  var totalCrashes = results.filter(function(f) { return f.type === 'crash'; }).reduce(function(s, f) { return s + f.data.length; }, 0);
  var totalErrors = results.reduce(function(sum, f) {
    if (f.type === 'system') return sum + f.data.severityCounts.ERROR;
    if (f.type === 'generic') return sum + f.data.errors;
    if (f.type === 'network') return sum + f.data.errors.length;
    return sum;
  }, 0);
  var totalWarnings = results.reduce(function(sum, f) {
    if (f.type === 'system') return sum + f.data.severityCounts.WARN;
    if (f.type === 'generic') return sum + f.data.warnings;
    return sum;
  }, 0);
  var oomCount = results.filter(function(f) { return f.type === 'memory'; }).reduce(function(s, f) { return s + f.data.oomEvents; }, 0);
  return { totalCrashes: totalCrashes, totalErrors: totalErrors, totalWarnings: totalWarnings, oomCount: oomCount };
}

function buildFindings(results) {
  var findings = [];

  results.filter(function(f) { return f.type === 'crash' && f.data.length > 0; }).forEach(function(f) {
    var types = {};
    f.data.forEach(function(c) {
      var t = c.type || 'Unknown';
      if (!types[t]) types[t] = { count: 0, first: c };
      types[t].count++;
    });
    Object.keys(types).forEach(function(t) {
      var info = types[t];
      findings.push({
        priority: 1, icon: '[CRASH]',
        title: t + ' in ' + f.path + ' (' + info.count + 'x)',
        detail: info.first.message,
        stack: info.first.stack.slice(0, 3).join('\n         ')
      });
    });
  });

  results.filter(function(f) { return f.type === 'memory' && f.data.oomEvents > 0; }).forEach(function(f) {
    findings.push({
      priority: 1, icon: '[MEMORY]',
      title: 'Out of memory in ' + f.path + ' (' + f.data.oomEvents + ' events)',
      detail: 'Peak usage: ' + f.data.peakUsage + ' MB'
    });
  });

  results.filter(function(f) { return f.type === 'network'; }).forEach(function(f) {
    var d = f.data;
    var issues = [];
    if (d.timeouts > 0) issues.push(d.timeouts + ' timeouts');
    if (d.connectionRefused > 0) issues.push(d.connectionRefused + ' connection refused');
    if (d.dnsFailures > 0) issues.push(d.dnsFailures + ' DNS failures');
    if (issues.length > 0) {
      findings.push({
        priority: 2, icon: '[NETWORK]',
        title: 'Network issues in ' + f.path,
        detail: issues.join(', ')
      });
    }
  });

  results.filter(function(f) { return f.type === 'system' && f.data.severityCounts.ERROR > 5; }).forEach(function(f) {
    var topErrors = {};
    f.data.entries.filter(function(e) { return e.severity === 'ERROR'; }).forEach(function(e) {
      var key = e.message.slice(0, 80);
      if (!topErrors[key]) topErrors[key] = 0;
      topErrors[key]++;
    });
    var sorted = Object.keys(topErrors).sort(function(a, b) { return topErrors[b] - topErrors[a]; });
    findings.push({
      priority: 2, icon: '[ERRORS]',
      title: f.data.severityCounts.ERROR + ' errors in ' + f.path,
      detail: 'Top: ' + sorted.slice(0, 3).map(function(k) { return '"' + k + '" (' + topErrors[k] + 'x)'; }).join(', ')
    });
  });

  findings.sort(function(a, b) { return a.priority - b.priority; });
  return findings;
}

function buildNextSteps(results, totalCrashes, totalErrors, oomCount) {
  var steps = [];

  if (totalCrashes > 0) {
    var crashTypes = {};
    results.filter(function(f) { return f.type === 'crash'; }).forEach(function(f) {
      f.data.forEach(function(c) { crashTypes[c.type] = true; });
    });
    var ctKeys = Object.keys(crashTypes);

    if (ctKeys.some(function(t) { return /SIGSEGV|SIGABRT/i.test(t); })) {
      steps.push('Investigate signal-based crashes (SIGSEGV/SIGABRT) \u2014 likely a null pointer dereference or memory corruption. Check stack traces and review recent code changes to those code paths.');
    }
    if (ctKeys.some(function(t) { return /panic/i.test(t); })) {
      steps.push('Review panic stack traces \u2014 these are unrecovered runtime errors. Add appropriate error handling or fix the root cause.');
    }
    if (ctKeys.some(function(t) { return /Exception|Error/i.test(t); })) {
      steps.push('Review unhandled exceptions \u2014 add try/catch or fix the conditions that cause them. Check if a dependency or service is unavailable.');
    }
  }

  if (oomCount > 0) {
    var peakMB = results.filter(function(f) { return f.type === 'memory'; }).reduce(function(max, f) { return Math.max(max, f.data.peakUsage); }, 0);
    steps.push('Address out-of-memory conditions (peak: ' + peakMB + ' MB). Check for memory leaks, unbounded caches, or large data loads. Consider increasing memory limits or adding backpressure mechanisms.');
  }

  var netResults = results.filter(function(f) { return f.type === 'network'; });
  var totalTimeouts = netResults.reduce(function(s, f) { return s + f.data.timeouts; }, 0);
  var totalRefused = netResults.reduce(function(s, f) { return s + f.data.connectionRefused; }, 0);
  var totalDns = netResults.reduce(function(s, f) { return s + f.data.dnsFailures; }, 0);

  if (totalRefused > 0) steps.push('Fix connection refused errors (' + totalRefused + 'x) \u2014 a downstream service is down or unreachable. Verify the service is running and the host/port configuration is correct.');
  if (totalTimeouts > 0) steps.push('Investigate network timeouts (' + totalTimeouts + 'x) \u2014 could indicate slow downstream services or network congestion. Check latency metrics and consider adjusting timeout values.');
  if (totalDns > 0) steps.push('Resolve DNS failures (' + totalDns + 'x) \u2014 check DNS configuration, /etc/resolv.conf, and ensure hostnames are correct.');

  if (totalErrors > 10 && totalCrashes === 0 && oomCount === 0) {
    steps.push('Triage the ' + totalErrors + ' errors across log files. Group by type, identify the most frequent ones, and fix highest-impact first.');
  }

  return steps;
}

function generateTextReport(results, severity, meta) {
  var r = '';
  var line = '────────────────────────────────────────────────────────────\n';
  var now = new Date();
  var t = computeTotals(results);

  // Header
  r += line;
  r += '  D5 LOG DIAGNOSTICS REPORT\n';
  r += '  ' + now.toLocaleDateString() + ' ' + now.toLocaleTimeString() + '\n';
  if (meta.username) r += '  User:    ' + meta.username + '\n';
  if (meta.sourceFiles && meta.sourceFiles.length) {
    r += '  Source:  ' + meta.sourceFiles.join(', ') + '\n';
  }
  r += line + '\n';

  r += 'SUMMARY\n';
  r += '  Severity:   ' + severity.label.toUpperCase() + '\n';
  r += '  Files:      ' + results.length + ' analyzed\n';
  r += '  Crashes:    ' + t.totalCrashes + '\n';
  r += '  Errors:     ' + t.totalErrors + '\n';
  r += '  Warnings:   ' + t.totalWarnings + '\n';
  if (t.oomCount > 0) r += '  OOM Events: ' + t.oomCount + '\n';
  r += '\n';

  var findings = buildFindings(results);
  if (findings.length > 0) {
    r += 'KEY FINDINGS\n';
    findings.forEach(function(f, i) {
      r += '\n  ' + (i + 1) + '. ' + f.icon + ' ' + f.title + '\n';
      if (f.detail) r += '     ' + f.detail + '\n';
      if (f.stack) r += '         ' + f.stack + '\n';
    });
    r += '\n';
  }

  r += line;
  r += 'RECOMMENDED NEXT STEPS\n\n';
  var steps = buildNextSteps(results, t.totalCrashes, t.totalErrors, t.oomCount);
  if (steps.length > 0) {
    steps.forEach(function(s, i) {
      r += '  ' + (i + 1) + '. ' + s + '\n\n';
    });
  } else {
    r += '  No critical issues found. System appears healthy.\n';
    if (t.totalWarnings > 0) {
      r += '  Consider reviewing ' + t.totalWarnings + ' warnings for potential future issues.\n';
    }
    r += '\n';
  }

  r += line;
  r += 'FILE DETAILS\n\n';
  results.forEach(function(f) {
    r += '  ' + f.path + ' [' + f.type + ']\n';
    switch (f.type) {
      case 'crash': r += '    ' + f.data.length + ' crashes\n'; break;
      case 'system': r += '    ' + f.data.total + ' entries, ' + f.data.severityCounts.ERROR + ' errors, ' + f.data.severityCounts.WARN + ' warnings\n'; break;
      case 'memory': r += '    Peak ' + f.data.peakUsage + ' MB, ' + f.data.oomEvents + ' OOM events\n'; break;
      case 'network': r += '    ' + f.data.errors.length + ' errors, ' + f.data.timeouts + ' timeouts, ' + f.data.connectionRefused + ' refused, ' + f.data.dnsFailures + ' DNS\n'; break;
      case 'generic': r += '    ' + f.data.totalLines + ' lines, ' + f.data.errors + ' errors, ' + f.data.warnings + ' warnings\n'; break;
    }
  });
  r += '\n' + line;
  return r;
}

// ─── DOM Rendering ──────────────────────────────────────────────────────────

var $ = function(id) { return document.getElementById(id); };

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderStatBox(value, label) {
  return '<div class="stat-box"><div class="value">' + esc(String(value)) + '</div><div class="label">' + esc(label) + '</div></div>';
}

function renderCrashCard(f) {
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span>';
  html += '<span class="tag" style="background:#ff444422;color:#ff4444">' + f.data.length + ' crash' + (f.data.length !== 1 ? 'es' : '') + '</span></div>';
  if (!f.data.length) { html += '<div style="color:#888;font-size:13px">No crashes detected</div>'; }
  f.data.slice(0, 10).forEach(function(c) {
    html += '<div class="crash-item">';
    html += '<div class="crash-type">' + esc(c.type) + (c.timestamp ? ' @ ' + esc(c.timestamp) : '') + '</div>';
    html += '<div class="crash-msg">' + esc(c.message) + '</div>';
    if (c.stack.length) html += '<pre class="log">' + esc(c.stack.join('\n')) + '</pre>';
    html += '</div>';
  });
  return html + '</div>';
}

function renderSystemCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="stat-row">' + renderStatBox(d.total, 'Total') + renderStatBox(d.severityCounts.ERROR, 'Errors') + renderStatBox(d.severityCounts.WARN, 'Warnings') + '</div>';
  if (d.severityCounts.ERROR > 0) {
    html += '<div style="font-size:12px;color:#888;margin-bottom:4px">Recent errors:</div>';
    html += '<table><thead><tr><th>Time</th><th>Message</th></tr></thead><tbody>';
    d.entries.filter(function(e) { return e.severity === 'ERROR'; }).slice(0, 10).forEach(function(e) {
      html += '<tr><td class="ts">' + esc(e.timestamp) + '</td><td>' + esc(e.message) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  return html + '</div>';
}

function renderMemoryCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="stat-row">' + renderStatBox(d.peakUsage + ' MB', 'Peak Usage') + renderStatBox(d.oomEvents, 'OOM Events') + renderStatBox(d.dataPoints.length, 'Data Points') + '</div>';
  if (d.oomEvents > 0) html += '<span class="tag" style="background:#ff444422;color:#ff4444">OOM Detected!</span>';
  return html + '</div>';
}

function renderNetworkCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="stat-row">' + renderStatBox(d.errors.length, 'Errors') + renderStatBox(d.timeouts, 'Timeouts') + renderStatBox(d.connectionRefused, 'Refused') + renderStatBox(d.dnsFailures, 'DNS Failures') + '</div>';
  if (d.errors.length > 0) {
    html += '<div style="font-size:12px;color:#888;margin-bottom:4px">Recent errors:</div>';
    d.errors.slice(0, 10).forEach(function(e) {
      html += '<div class="error-line">';
      if (e.timestamp) html += '<span class="ts">' + esc(e.timestamp) + '</span>';
      html += esc(e.message) + '</div>';
    });
  }
  return html + '</div>';
}

function renderGenericCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="stat-row">' + renderStatBox(d.totalLines, 'Lines') + renderStatBox(d.errors, 'Errors') + renderStatBox(d.warnings, 'Warnings') + '</div>';
  if (d.sampleErrors.length > 0) html += '<pre class="log">' + esc(d.sampleErrors.slice(0, 5).join('\n')) + '</pre>';
  return html + '</div>';
}

function renderFileCard(f) {
  if (f.type === 'error') {
    return '<div class="card"><div class="card-title">' + esc(f.path) + '</div><div style="color:#ff8888;font-size:13px">Parse error: ' + esc(f.data.error) + '</div></div>';
  }
  switch (f.type) {
    case 'crash': return renderCrashCard(f);
    case 'system': return renderSystemCard(f);
    case 'memory': return renderMemoryCard(f);
    case 'network': return renderNetworkCard(f);
    default: return renderGenericCard(f);
  }
}

var currentResults = null;
var currentSeverity = null;
var currentSourceFiles = [];
var activeTab = 'all';

function renderReport(results) {
  currentResults = results;
  currentSeverity = getSeverity(results);
  activeTab = 'all';

  var types = ['all'];
  var seen = {};
  results.forEach(function(r) { if (!seen[r.type]) { seen[r.type] = true; types.push(r.type); } });

  var totalCrashes = results.filter(function(r) { return r.type === 'crash'; }).reduce(function(s, r) { return s + r.data.length; }, 0);
  var totalErrors = results.reduce(function(sum, r) {
    if (r.type === 'system') return sum + r.data.severityCounts.ERROR;
    if (r.type === 'generic') return sum + r.data.errors;
    if (r.type === 'network') return sum + r.data.errors.length;
    return sum;
  }, 0);

  var html = '<div class="top-actions"><button class="btn btn-sec" onclick="resetApp()">Analyze New Files</button></div>';

  // Summary bar
  html += '<div class="card summary-bar">';
  html += '<div class="summary-left"><span class="badge" style="background:' + currentSeverity.color + '">' + esc(currentSeverity.label) + '</span>';
  html += '<span class="file-info">' + results.length + ' files analyzed</span></div>';
  html += '<div class="summary-right"><span class="summary-info">' + totalCrashes + ' crashes \u00B7 ' + totalErrors + ' errors</span>';
  html += '<button class="btn btn-sec" onclick="exportTxt()">Export TXT</button> ';
  html += '<button class="btn btn-sec" onclick="exportPdf()">Export PDF</button></div></div>';

  // Tabs
  html += '<div class="tab-bar" id="tab-bar">';
  types.forEach(function(t) {
    var count = t === 'all' ? results.length : results.filter(function(r) { return r.type === t; }).length;
    var cls = t === 'all' ? 'active' : '';
    html += '<button class="' + cls + '" data-tab="' + t + '" onclick="switchTab(\'' + t + '\')">' + (t === 'all' ? 'All' : t) + ' (' + count + ')</button>';
  });
  html += '</div>';

  // Cards
  html += '<div id="cards-container">';
  results.forEach(function(f) { html += renderFileCard(f); });
  html += '</div>';

  $('report-section').innerHTML = html;
  $('report-section').classList.remove('hidden');
}

function switchTab(tab) {
  activeTab = tab;
  var filtered = tab === 'all' ? currentResults : currentResults.filter(function(r) { return r.type === tab; });
  var html = '';
  filtered.forEach(function(f) { html += renderFileCard(f); });
  document.getElementById('cards-container').innerHTML = html;

  var buttons = document.querySelectorAll('#tab-bar button');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].className = buttons[i].getAttribute('data-tab') === tab ? 'active' : '';
  }
}

function getExportMeta() {
  var username = detectUsername(currentResults) || 'unknown';
  return { username: username, sourceFiles: currentSourceFiles };
}

function exportTxt() {
  var text = generateTextReport(currentResults, currentSeverity, getExportMeta());
  var blob = new Blob([text], { type: 'text/plain' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'd5-diagnostics-' + Date.now() + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function exportPdf() {
  var meta = getExportMeta();
  var severity = currentSeverity;
  var results = currentResults;
  var now = new Date();

  var totalCrashes = results.filter(function(f) { return f.type === 'crash'; }).reduce(function(s, f) { return s + f.data.length; }, 0);
  var totalErrors = results.reduce(function(sum, f) {
    if (f.type === 'system') return sum + f.data.severityCounts.ERROR;
    if (f.type === 'generic') return sum + f.data.errors;
    if (f.type === 'network') return sum + f.data.errors.length;
    return sum;
  }, 0);
  var totalWarnings = results.reduce(function(sum, f) {
    if (f.type === 'system') return sum + f.data.severityCounts.WARN;
    if (f.type === 'generic') return sum + f.data.warnings;
    return sum;
  }, 0);
  var oomCount = results.filter(function(f) { return f.type === 'memory'; }).reduce(function(s, f) { return s + f.data.oomEvents; }, 0);

  // Build styled HTML for print
  var h = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>D5 Diagnostics Report</title><style>';
  h += 'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;margin:40px;font-size:12px;line-height:1.5}';
  h += 'h1{font-size:22px;margin:0 0 2px;color:#111}';
  h += '.meta{color:#666;font-size:11px;margin-bottom:4px}';
  h += '.sep{border-top:2px solid #222;margin:16px 0}';
  h += '.sep-light{border-top:1px solid #ccc;margin:12px 0}';
  h += 'h2{font-size:15px;margin:16px 0 8px;color:#111;text-transform:uppercase;letter-spacing:0.5px}';
  h += '.badge{display:inline-block;padding:3px 10px;border-radius:10px;color:#fff;font-weight:700;font-size:11px}';
  h += '.stats{display:flex;gap:24px;margin:8px 0 16px}';
  h += '.stat{text-align:center}.stat .val{font-size:22px;font-weight:700;color:#111}.stat .lbl{font-size:10px;color:#888;text-transform:uppercase}';
  h += '.finding{margin-bottom:10px;padding:8px 12px;border-left:3px solid #ccc;background:#f8f8f8}';
  h += '.finding.p1{border-left-color:#e53e3e}.finding.p2{border-left-color:#dd6b20}';
  h += '.finding-title{font-weight:600;font-size:12px}.finding-detail{font-size:11px;color:#555;margin-top:2px}';
  h += '.step{margin-bottom:10px}.step-num{font-weight:700;color:#2b6cb0}.step-text{color:#333}';
  h += '.file-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;font-size:11px}';
  h += '.file-name{font-weight:600;color:#333}.file-stats{color:#888}';
  h += 'pre{background:#f5f5f5;padding:8px;border-radius:4px;font-size:10px;overflow:hidden;white-space:pre-wrap;word-break:break-word}';
  h += 'table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}';
  h += 'th{text-align:left;padding:4px 6px;border-bottom:2px solid #ccc;color:#666;font-size:10px;text-transform:uppercase}';
  h += 'td{padding:4px 6px;border-bottom:1px solid #eee}';
  h += '@media print{body{margin:20px}@page{margin:15mm;size:A4}}';
  h += '</style></head><body>';

  // Header
  h += '<h1>D5 Log Diagnostics Report</h1>';
  h += '<div class="meta">' + now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
  if (meta.username) h += ' &nbsp;|&nbsp; User: <strong>' + esc(meta.username) + '</strong>';
  if (meta.sourceFiles.length) h += ' &nbsp;|&nbsp; Source: ' + esc(meta.sourceFiles.join(', '));
  h += '</div>';
  h += '<div class="sep"></div>';

  // Summary
  h += '<h2>Summary</h2>';
  h += '<div><span class="badge" style="background:' + severity.color + '">' + esc(severity.label) + '</span></div>';
  h += '<div class="stats">';
  h += '<div class="stat"><div class="val">' + results.length + '</div><div class="lbl">Files</div></div>';
  h += '<div class="stat"><div class="val">' + totalCrashes + '</div><div class="lbl">Crashes</div></div>';
  h += '<div class="stat"><div class="val">' + totalErrors + '</div><div class="lbl">Errors</div></div>';
  h += '<div class="stat"><div class="val">' + totalWarnings + '</div><div class="lbl">Warnings</div></div>';
  if (oomCount > 0) h += '<div class="stat"><div class="val" style="color:#e53e3e">' + oomCount + '</div><div class="lbl">OOM Events</div></div>';
  h += '</div>';

  // Key Findings
  var findings = buildFindings(results);
  if (findings.length > 0) {
    h += '<div class="sep-light"></div>';
    h += '<h2>Key Findings</h2>';
    findings.forEach(function(f) {
      h += '<div class="finding p' + f.priority + '">';
      h += '<div class="finding-title">' + esc(f.icon + ' ' + f.title) + '</div>';
      if (f.detail) h += '<div class="finding-detail">' + esc(f.detail) + '</div>';
      if (f.stack) h += '<pre>' + esc(f.stack) + '</pre>';
      h += '</div>';
    });
  }

  // Next Steps
  var steps = buildNextSteps(results, totalCrashes, totalErrors, oomCount);
  if (steps.length > 0) {
    h += '<div class="sep"></div>';
    h += '<h2>Recommended Next Steps</h2>';
    steps.forEach(function(s, i) {
      h += '<div class="step"><span class="step-num">' + (i + 1) + '.</span> <span class="step-text">' + esc(s) + '</span></div>';
    });
  }

  // File Details
  h += '<div class="sep"></div>';
  h += '<h2>File Details</h2>';

  results.forEach(function(f) {
    var detail = '';
    switch (f.type) {
      case 'crash': detail = f.data.length + ' crashes'; break;
      case 'system': detail = f.data.total + ' entries, ' + f.data.severityCounts.ERROR + ' errors, ' + f.data.severityCounts.WARN + ' warnings'; break;
      case 'memory': detail = 'Peak ' + f.data.peakUsage + ' MB, ' + f.data.oomEvents + ' OOM'; break;
      case 'network': detail = f.data.errors.length + ' errors, ' + f.data.timeouts + ' timeouts'; break;
      case 'generic': detail = f.data.totalLines + ' lines, ' + f.data.errors + ' errors'; break;
      default: detail = f.type;
    }
    h += '<div class="file-row"><span class="file-name">' + esc(f.path) + ' <span style="color:#aaa;font-weight:400">[' + f.type + ']</span></span><span class="file-stats">' + esc(detail) + '</span></div>';
  });

  // Crash details appendix
  var crashFiles = results.filter(function(f) { return f.type === 'crash' && f.data.length > 0; });
  if (crashFiles.length > 0) {
    h += '<div class="sep"></div>';
    h += '<h2>Crash Details</h2>';
    crashFiles.forEach(function(f) {
      f.data.slice(0, 10).forEach(function(c) {
        h += '<div style="margin-bottom:8px">';
        h += '<div style="font-weight:600;color:#e53e3e;font-size:11px">' + esc(c.type) + (c.timestamp ? ' @ ' + esc(c.timestamp) : '') + '</div>';
        h += '<div style="font-size:11px;color:#444">' + esc(c.message) + '</div>';
        if (c.stack.length) h += '<pre>' + esc(c.stack.join('\n')) + '</pre>';
        h += '</div>';
      });
    });
  }

  // Error details appendix
  var sysFiles = results.filter(function(f) { return f.type === 'system' && f.data.severityCounts.ERROR > 0; });
  if (sysFiles.length > 0) {
    h += '<div class="sep"></div>';
    h += '<h2>Error Log Details</h2>';
    sysFiles.forEach(function(f) {
      h += '<div style="font-weight:600;margin:8px 0 4px">' + esc(f.path) + '</div>';
      h += '<table><thead><tr><th>Time</th><th>Message</th></tr></thead><tbody>';
      f.data.entries.filter(function(e) { return e.severity === 'ERROR'; }).slice(0, 15).forEach(function(e) {
        h += '<tr><td style="white-space:nowrap;color:#888">' + esc(e.timestamp) + '</td><td>' + esc(e.message) + '</td></tr>';
      });
      h += '</tbody></table>';
    });
  }

  h += '</body></html>';

  var win = window.open('', '_blank');
  win.document.write(h);
  win.document.close();
  setTimeout(function() { win.print(); }, 300);
}

function resetApp() {
  currentResults = null;
  currentSeverity = null;
  currentSourceFiles = [];
  $('report-section').classList.add('hidden');
  $('report-section').innerHTML = '';
  $('upload-section').classList.remove('hidden');
  $('error-msg').classList.add('hidden');
  $('file-input').value = '';
}

function handleFiles(files) {
  if (!files.length) return;
  currentSourceFiles = [];
  for (var j = 0; j < files.length; j++) currentSourceFiles.push(files[j].name);
  $('upload-section').classList.add('hidden');
  $('error-msg').classList.add('hidden');
  $('loading-section').classList.remove('hidden');

  var chain = Promise.resolve([]);
  for (var i = 0; i < files.length; i++) {
    (function(file) {
      chain = chain.then(function(all) {
        if (/\.zip$/i.test(file.name)) {
          return processZip(file).then(function(r) { return all.concat(r); });
        } else {
          return processSingleFile(file).then(function(r) { return all.concat(r); });
        }
      });
    })(files[i]);
  }

  chain.then(function(allResults) {
    $('loading-section').classList.add('hidden');
    if (allResults.length === 0) {
      $('upload-section').classList.remove('hidden');
      $('error-msg').textContent = 'No log files found. Supported: .log, .txt, .out, .err, .crash, .dump, .trace';
      $('error-msg').classList.remove('hidden');
    } else {
      renderReport(allResults);
    }
  }).catch(function(e) {
    $('loading-section').classList.add('hidden');
    $('upload-section').classList.remove('hidden');
    $('error-msg').textContent = 'Failed to process files: ' + e.message;
    $('error-msg').classList.remove('hidden');
  });
}

// ─── Event Listeners ────────────────────────────────────────────────────────

var dropzone = $('dropzone');
var fileInput = $('file-input');

dropzone.addEventListener('click', function() { fileInput.click(); });
dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.classList.add('active'); });
dropzone.addEventListener('dragleave', function() { dropzone.classList.remove('active'); });
dropzone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropzone.classList.remove('active');
  var files = [];
  for (var i = 0; i < e.dataTransfer.files.length; i++) files.push(e.dataTransfer.files[i]);
  handleFiles(files);
});
fileInput.addEventListener('change', function(e) {
  var files = [];
  for (var i = 0; i < e.target.files.length; i++) files.push(e.target.files[i]);
  handleFiles(files);
});
</script>
