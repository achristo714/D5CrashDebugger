<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D5 Log Diagnostics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"><div style="text-align:center;padding:80px;color:#888">Loading...</div></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
"use strict";

var useState = React.useState;
var useCallback = React.useCallback;
var useMemo = React.useMemo;
var useRef = React.useRef;
var h = React.createElement;

// ─── Parsers ────────────────────────────────────────────────────────────────

function parseCrashLog(text) {
  var lines = text.split('\n');
  var crashes = [];
  var current = null;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var tsMatch = line.match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})/);
    if (/\b(FATAL|CRASH|Exception|Error|SIGSEGV|SIGABRT|panic|Traceback)\b/i.test(line)) {
      current = {
        timestamp: tsMatch ? tsMatch[1] : null,
        type: (line.match(/\b(FATAL|CRASH|SIGSEGV|SIGABRT|panic|Exception|Error)\b/i) || ['Unknown'])[0],
        message: line.trim(),
        stack: []
      };
      crashes.push(current);
    } else if (current && /^\s+(at |#\d|frame|0x|\.\.\.)/.test(line)) {
      current.stack.push(line.trim());
    } else if (current && line.trim() === '') {
      current = null;
    }
  }
  return crashes;
}

function parseSystemLog(text) {
  var lines = text.split('\n');
  var entries = [];
  var severityCounts = { ERROR: 0, WARN: 0, INFO: 0, DEBUG: 0 };

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (!line.trim()) continue;
    var match = line.match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2}[^\s]*)\s+\[?(ERROR|WARN|WARNING|INFO|DEBUG)\]?\s*(.*)/i);
    if (match) {
      var severity = match[2].toUpperCase().startsWith('WARN') ? 'WARN' : match[2].toUpperCase();
      if (severityCounts[severity] !== undefined) severityCounts[severity]++;
      entries.push({ timestamp: match[1], severity: severity, message: match[3].trim() });
    }
  }
  return { entries: entries, severityCounts: severityCounts, total: entries.length };
}

function parseMemoryLog(text) {
  var lines = text.split('\n');
  var dataPoints = [];
  var peakUsage = 0;

  for (var i = 0; i < lines.length; i++) {
    var match = lines[i].match(/(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})[^\d]*(\d+(?:\.\d+)?)\s*(MB|GB|KB|bytes)/i);
    if (match) {
      var valueMB = parseFloat(match[2]);
      var unit = match[3].toUpperCase();
      if (unit === 'GB') valueMB *= 1024;
      else if (unit === 'KB') valueMB /= 1024;
      else if (unit === 'BYTES') valueMB /= (1024 * 1024);
      if (valueMB > peakUsage) peakUsage = valueMB;
      dataPoints.push({ timestamp: match[1], valueMB: valueMB });
    }
  }

  var oomEvents = (text.match(/\b(OOM|OutOfMemory|out of memory|oom-killer)\b/gi) || []).length;
  return { dataPoints: dataPoints, peakUsage: Math.round(peakUsage), oomEvents: oomEvents };
}

function parseNetworkLog(text) {
  var lines = text.split('\n');
  var errors = [];
  var timeouts = 0;
  var connectionRefused = 0;
  var dnsFailures = 0;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/timeout/i.test(line)) timeouts++;
    if (/connection refused/i.test(line)) connectionRefused++;
    if (/dns|resolve|NXDOMAIN/i.test(line)) dnsFailures++;
    if (/\b(error|fail|timeout|refused|unreachable)\b/i.test(line)) {
      var tsMatch = line.match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})/);
      errors.push({ timestamp: tsMatch ? tsMatch[1] : null, message: line.trim().slice(0, 200) });
    }
  }
  return { errors: errors.slice(0, 100), timeouts: timeouts, connectionRefused: connectionRefused, dnsFailures: dnsFailures };
}

function parseGenericLog(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  var errors = 0, warnings = 0;
  var errorLines = [];

  for (var i = 0; i < lines.length; i++) {
    if (/\berror\b/i.test(lines[i])) { errors++; errorLines.push(lines[i].trim().slice(0, 200)); }
    if (/\bwarn(ing)?\b/i.test(lines[i])) warnings++;
  }
  return { totalLines: lines.length, errors: errors, warnings: warnings, sampleErrors: errorLines.slice(0, 20) };
}

function classifyFile(name, content) {
  var lower = name.toLowerCase();
  if (/crash|fatal|panic|dump/i.test(lower)) return 'crash';
  if (/memory|mem|heap|oom/i.test(lower)) return 'memory';
  if (/network|net|conn|http/i.test(lower)) return 'network';
  if (/\b(FATAL|CRASH|SIGSEGV|SIGABRT|panic)\b/i.test(content.slice(0, 2000))) return 'crash';
  if (/\b(OOM|OutOfMemory|heap)\b/i.test(content.slice(0, 2000))) return 'memory';
  if (/system|syslog|main/i.test(lower)) return 'system';
  return 'generic';
}

function parseFile(name, content) {
  var type = classifyFile(name, content);
  switch (type) {
    case 'crash': return { type: 'crash', data: parseCrashLog(content) };
    case 'system': return { type: 'system', data: parseSystemLog(content) };
    case 'memory': return { type: 'memory', data: parseMemoryLog(content) };
    case 'network': return { type: 'network', data: parseNetworkLog(content) };
    default: return { type: 'generic', data: parseGenericLog(content) };
  }
}

function processZip(file) {
  return JSZip.loadAsync(file).then(function(zip) {
    var promises = [];
    Object.keys(zip.files).forEach(function(path) {
      var entry = zip.files[path];
      if (entry.dir) return;
      if (!/\.(log|txt|out|err|crash|dump|trace)$/i.test(path) && !/log/i.test(path)) return;
      promises.push(
        entry.async('string').then(function(content) {
          if (!content.trim()) return null;
          var parsed = parseFile(path, content);
          return Object.assign({ path: path, size: content.length }, parsed);
        }).catch(function(e) {
          return { path: path, type: 'error', data: { error: e.message } };
        })
      );
    });
    return Promise.all(promises).then(function(results) {
      return results.filter(function(r) { return r !== null; });
    });
  });
}

function processSingleFile(file) {
  return file.text().then(function(content) {
    if (!content.trim()) return [];
    var parsed = parseFile(file.name, content);
    return [Object.assign({ path: file.name, size: content.length }, parsed)];
  });
}

// ─── Severity / Report ──────────────────────────────────────────────────────

function getSeverity(results) {
  var hasCrashes = results.some(function(r) { return r.type === 'crash' && r.data.length > 0; });
  var hasOOM = results.some(function(r) { return r.type === 'memory' && r.data.oomEvents > 0; });
  var totalErrors = results.reduce(function(sum, r) {
    if (r.type === 'system') return sum + r.data.severityCounts.ERROR;
    if (r.type === 'generic') return sum + r.data.errors;
    if (r.type === 'network') return sum + r.data.errors.length;
    return sum;
  }, 0);

  if (hasCrashes || hasOOM) return { level: 'critical', color: '#ff4444', label: 'Critical' };
  if (totalErrors > 10) return { level: 'high', color: '#ff8c00', label: 'High' };
  if (totalErrors > 0) return { level: 'medium', color: '#ffd700', label: 'Medium' };
  return { level: 'low', color: '#44cc44', label: 'Low' };
}

function generateTextReport(results, severity) {
  var report = '=== D5 LOG DIAGNOSTICS REPORT ===\n';
  report += 'Generated: ' + new Date().toISOString() + '\n';
  report += 'Overall Severity: ' + severity.label + '\n';
  report += 'Files Analyzed: ' + results.length + '\n\n';

  results.forEach(function(r) {
    report += '--- ' + r.path + ' (' + r.type + ') ---\n';
    switch (r.type) {
      case 'crash':
        report += 'Crashes found: ' + r.data.length + '\n';
        r.data.forEach(function(c, i) {
          report += '  [' + (i + 1) + '] ' + c.type + ': ' + c.message + '\n';
          c.stack.forEach(function(s) { report += '       ' + s + '\n'; });
        });
        break;
      case 'system':
        report += 'Entries: ' + r.data.total + ' | Errors: ' + r.data.severityCounts.ERROR + ' | Warnings: ' + r.data.severityCounts.WARN + '\n';
        r.data.entries.filter(function(e) { return e.severity === 'ERROR'; }).slice(0, 5).forEach(function(e) {
          report += '  ERROR ' + e.timestamp + ': ' + e.message + '\n';
        });
        break;
      case 'memory':
        report += 'Peak: ' + r.data.peakUsage + ' MB | OOM Events: ' + r.data.oomEvents + ' | Data points: ' + r.data.dataPoints.length + '\n';
        break;
      case 'network':
        report += 'Errors: ' + r.data.errors.length + ' | Timeouts: ' + r.data.timeouts + ' | Refused: ' + r.data.connectionRefused + ' | DNS: ' + r.data.dnsFailures + '\n';
        break;
      case 'generic':
        report += 'Lines: ' + r.data.totalLines + ' | Errors: ' + r.data.errors + ' | Warnings: ' + r.data.warnings + '\n';
        r.data.sampleErrors.slice(0, 5).forEach(function(e) { report += '  ' + e + '\n'; });
        break;
    }
    report += '\n';
  });
  return report;
}

// ─── Styles ─────────────────────────────────────────────────────────────────

var S = {
  container: { maxWidth: 960, margin: '0 auto', padding: '24px 16px' },
  header: { textAlign: 'center', marginBottom: 32 },
  title: { fontSize: 28, fontWeight: 700, color: '#fff', marginBottom: 4 },
  subtitle: { fontSize: 14, color: '#888' },
  card: { background: '#2a2a2e', borderRadius: 8, padding: 16, marginBottom: 12, border: '1px solid #333' },
  cardTitle: { fontSize: 14, fontWeight: 600, color: '#ccc', marginBottom: 8 },
  stat: { fontSize: 24, fontWeight: 700, color: '#fff' },
  statLabel: { fontSize: 12, color: '#888', marginTop: 2 },
  statRow: { display: 'flex', gap: 16, flexWrap: 'wrap', marginBottom: 16 },
  statBox: { background: '#222', borderRadius: 8, padding: 12, minWidth: 100, flex: 1, textAlign: 'center' },
  table: { width: '100%', borderCollapse: 'collapse', fontSize: 13 },
  th: { textAlign: 'left', padding: '6px 8px', borderBottom: '1px solid #444', color: '#888', fontWeight: 600 },
  td: { padding: '6px 8px', borderBottom: '1px solid #333', color: '#ccc', wordBreak: 'break-word' },
  btn: { padding: '8px 16px', borderRadius: 6, border: 'none', cursor: 'pointer', fontWeight: 600, fontSize: 13 },
  btnSec: { background: '#444', color: '#ccc' },
  pre: { background: '#1a1a1e', padding: 12, borderRadius: 6, overflow: 'auto', fontSize: 12, color: '#aaa', maxHeight: 200 },
  tabBar: { display: 'flex', gap: 4, borderBottom: '1px solid #333', marginBottom: 16 },
};

function dropzoneStyle(active) {
  return { border: '2px dashed ' + (active ? '#4a9eff' : '#444'), borderRadius: 12, padding: 48, textAlign: 'center', cursor: 'pointer', background: active ? 'rgba(74,158,255,0.05)' : '#222', transition: 'all 0.2s', marginBottom: 24 };
}
function badgeStyle(color) {
  return { display: 'inline-block', padding: '4px 12px', borderRadius: 12, background: color, color: '#000', fontWeight: 700, fontSize: 13 };
}
function tagStyle(color) {
  return { display: 'inline-block', padding: '2px 8px', borderRadius: 4, background: color + '22', color: color, fontSize: 11, fontWeight: 600, marginRight: 4 };
}
function tabStyle(active) {
  return { padding: '8px 16px', border: 'none', borderBottom: active ? '2px solid #4a9eff' : '2px solid transparent', background: 'none', color: active ? '#fff' : '#888', cursor: 'pointer', fontWeight: 600, fontSize: 13 };
}

// ─── UI Components ──────────────────────────────────────────────────────────

function StatBox(props) {
  return h('div', { style: S.statBox },
    h('div', { style: S.stat }, props.value),
    h('div', { style: S.statLabel }, props.label)
  );
}

function CrashCard(props) {
  var file = props.file;
  var crashes = file.data;
  if (!crashes.length) return h('div', { style: S.card },
    h('div', { style: S.cardTitle }, file.path),
    h('div', { style: { color: '#888', fontSize: 13 } }, 'No crashes detected')
  );

  return h('div', { style: S.card },
    h('div', { style: Object.assign({}, S.cardTitle, { display: 'flex', justifyContent: 'space-between' }) },
      h('span', null, file.path),
      h('span', { style: tagStyle('#ff4444') }, crashes.length + ' crash' + (crashes.length > 1 ? 'es' : ''))
    ),
    crashes.slice(0, 10).map(function(c, i) {
      return h('div', { key: i, style: { marginBottom: 12 } },
        h('div', { style: { fontSize: 13, color: '#ff8888', fontWeight: 600 } }, c.type + (c.timestamp ? ' @ ' + c.timestamp : '')),
        h('div', { style: { fontSize: 12, color: '#ccc', margin: '4px 0' } }, c.message),
        c.stack.length > 0 ? h('pre', { style: S.pre }, c.stack.join('\n')) : null
      );
    })
  );
}

function SystemCard(props) {
  var d = props.file.data;
  return h('div', { style: S.card },
    h('div', { style: S.cardTitle }, props.file.path),
    h('div', { style: S.statRow },
      h(StatBox, { value: d.total, label: 'Total' }),
      h(StatBox, { value: d.severityCounts.ERROR, label: 'Errors' }),
      h(StatBox, { value: d.severityCounts.WARN, label: 'Warnings' })
    ),
    d.severityCounts.ERROR > 0 ? h('div', null,
      h('div', { style: { fontSize: 12, color: '#888', marginBottom: 4 } }, 'Recent errors:'),
      h('table', { style: S.table },
        h('thead', null, h('tr', null, h('th', { style: S.th }, 'Time'), h('th', { style: S.th }, 'Message'))),
        h('tbody', null, d.entries.filter(function(e) { return e.severity === 'ERROR'; }).slice(0, 10).map(function(e, i) {
          return h('tr', { key: i },
            h('td', { style: Object.assign({}, S.td, { whiteSpace: 'nowrap', color: '#888' }) }, e.timestamp),
            h('td', { style: S.td }, e.message)
          );
        }))
      )
    ) : null
  );
}

function MemoryCard(props) {
  var d = props.file.data;
  return h('div', { style: S.card },
    h('div', { style: S.cardTitle }, props.file.path),
    h('div', { style: S.statRow },
      h(StatBox, { value: d.peakUsage + ' MB', label: 'Peak Usage' }),
      h(StatBox, { value: d.oomEvents, label: 'OOM Events' }),
      h(StatBox, { value: d.dataPoints.length, label: 'Data Points' })
    ),
    d.oomEvents > 0 ? h('div', { style: tagStyle('#ff4444') }, 'OOM Detected!') : null
  );
}

function NetworkCard(props) {
  var d = props.file.data;
  return h('div', { style: S.card },
    h('div', { style: S.cardTitle }, props.file.path),
    h('div', { style: S.statRow },
      h(StatBox, { value: d.errors.length, label: 'Errors' }),
      h(StatBox, { value: d.timeouts, label: 'Timeouts' }),
      h(StatBox, { value: d.connectionRefused, label: 'Refused' }),
      h(StatBox, { value: d.dnsFailures, label: 'DNS Failures' })
    ),
    d.errors.length > 0 ? h('div', null,
      h('div', { style: { fontSize: 12, color: '#888', marginBottom: 4 } }, 'Recent errors:'),
      d.errors.slice(0, 10).map(function(e, i) {
        return h('div', { key: i, style: { fontSize: 12, color: '#ccc', padding: '4px 0', borderBottom: '1px solid #333' } },
          e.timestamp ? h('span', { style: { color: '#888', marginRight: 8 } }, e.timestamp) : null,
          e.message
        );
      })
    ) : null
  );
}

function GenericCard(props) {
  var d = props.file.data;
  return h('div', { style: S.card },
    h('div', { style: S.cardTitle }, props.file.path),
    h('div', { style: S.statRow },
      h(StatBox, { value: d.totalLines, label: 'Lines' }),
      h(StatBox, { value: d.errors, label: 'Errors' }),
      h(StatBox, { value: d.warnings, label: 'Warnings' })
    ),
    d.sampleErrors.length > 0 ? h('pre', { style: S.pre }, d.sampleErrors.slice(0, 5).join('\n')) : null
  );
}

function FileCard(props) {
  var file = props.file;
  if (file.type === 'error') {
    return h('div', { style: S.card },
      h('div', { style: S.cardTitle }, file.path),
      h('div', { style: { color: '#ff8888', fontSize: 13 } }, 'Parse error: ' + file.data.error)
    );
  }
  switch (file.type) {
    case 'crash': return h(CrashCard, { file: file });
    case 'system': return h(SystemCard, { file: file });
    case 'memory': return h(MemoryCard, { file: file });
    case 'network': return h(NetworkCard, { file: file });
    default: return h(GenericCard, { file: file });
  }
}

function Report(props) {
  var results = props.results;
  var tabState = useState('all');
  var activeTab = tabState[0];
  var setActiveTab = tabState[1];

  var severity = useMemo(function() { return getSeverity(results); }, [results]);

  var tabs = useMemo(function() {
    var types = ['all'];
    var seen = {};
    results.forEach(function(r) { if (!seen[r.type]) { seen[r.type] = true; types.push(r.type); } });
    return types;
  }, [results]);

  var filtered = activeTab === 'all' ? results : results.filter(function(r) { return r.type === activeTab; });

  var totalCrashes = results.filter(function(r) { return r.type === 'crash'; }).reduce(function(s, r) { return s + r.data.length; }, 0);
  var totalErrors = results.reduce(function(sum, r) {
    if (r.type === 'system') return sum + r.data.severityCounts.ERROR;
    if (r.type === 'generic') return sum + r.data.errors;
    if (r.type === 'network') return sum + r.data.errors.length;
    return sum;
  }, 0);

  var handleExport = function() {
    var text = generateTextReport(results, severity);
    var blob = new Blob([text], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'd5-diagnostics-' + Date.now() + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  };

  return h('div', null,
    h('div', { style: Object.assign({}, S.card, { display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }) },
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
        h('span', { style: badgeStyle(severity.color) }, severity.label),
        h('span', { style: { fontSize: 14, color: '#ccc' } }, results.length + ' files analyzed')
      ),
      h('div', { style: { display: 'flex', gap: 12, alignItems: 'center' } },
        h('span', { style: { fontSize: 13, color: '#888' } }, totalCrashes + ' crashes \u00B7 ' + totalErrors + ' errors'),
        h('button', { style: Object.assign({}, S.btn, S.btnSec), onClick: handleExport }, 'Export Report')
      )
    ),
    h('div', { style: S.tabBar },
      tabs.map(function(t) {
        var count = t === 'all' ? results.length : results.filter(function(r) { return r.type === t; }).length;
        return h('button', { key: t, style: tabStyle(activeTab === t), onClick: function() { setActiveTab(t); } },
          (t === 'all' ? 'All' : t) + ' (' + count + ')'
        );
      })
    ),
    filtered.map(function(f, i) { return h(FileCard, { key: i, file: f }); })
  );
}

function App() {
  var resultState = useState(null);
  var results = resultState[0]; var setResults = resultState[1];
  var loadState = useState(false);
  var loading = loadState[0]; var setLoading = loadState[1];
  var dragState = useState(false);
  var dragActive = dragState[0]; var setDragActive = dragState[1];
  var errState = useState(null);
  var error = errState[0]; var setError = errState[1];
  var inputRef = useRef(null);

  var handleFiles = useCallback(function(files) {
    if (!files.length) return;
    setLoading(true);
    setError(null);

    var chain = Promise.resolve([]);
    for (var i = 0; i < files.length; i++) {
      (function(file) {
        chain = chain.then(function(all) {
          if (/\.zip$/i.test(file.name)) {
            return processZip(file).then(function(r) { return all.concat(r); });
          } else {
            return processSingleFile(file).then(function(r) { return all.concat(r); });
          }
        });
      })(files[i]);
    }

    chain.then(function(allResults) {
      if (allResults.length === 0) {
        setError('No log files found. Supported: .log, .txt, .out, .err, .crash, .dump, .trace');
      } else {
        setResults(allResults);
      }
      setLoading(false);
    }).catch(function(e) {
      setError('Failed to process files: ' + e.message);
      setLoading(false);
    });
  }, []);

  var onDrop = useCallback(function(e) {
    e.preventDefault();
    setDragActive(false);
    var files = [];
    for (var i = 0; i < e.dataTransfer.files.length; i++) files.push(e.dataTransfer.files[i]);
    handleFiles(files);
  }, [handleFiles]);

  var onDragOver = useCallback(function(e) { e.preventDefault(); setDragActive(true); }, []);
  var onDragLeave = useCallback(function() { setDragActive(false); }, []);
  var onReset = useCallback(function() { setResults(null); setError(null); }, []);

  if (loading) {
    return h('div', { style: S.container },
      h('div', { style: { textAlign: 'center', padding: 48, color: '#888' } },
        h('div', { style: { fontSize: 18, marginBottom: 8 } }, 'Analyzing logs...'),
        h('div', { style: { fontSize: 13 } }, 'Parsing files and detecting issues')
      )
    );
  }

  return h('div', { style: S.container },
    h('div', { style: S.header },
      h('div', { style: S.title }, 'D5 Log Diagnostics'),
      h('div', { style: S.subtitle }, 'Drop a zip or log files to analyze crashes, errors, memory, and network issues')
    ),
    !results ? h('div', null,
      h('div', {
        style: dropzoneStyle(dragActive),
        onDrop: onDrop, onDragOver: onDragOver, onDragLeave: onDragLeave,
        onClick: function() { if (inputRef.current) inputRef.current.click(); }
      },
        h('div', { style: { fontSize: 16, color: '#aaa', marginBottom: 8 } }, dragActive ? 'Drop files here' : 'Drag & drop log files or zip archives'),
        h('div', { style: { fontSize: 12, color: '#666' } }, '.zip, .log, .txt, .out, .err, .crash, .dump, .trace'),
        h('input', {
          ref: inputRef, type: 'file', multiple: true,
          accept: '.zip,.log,.txt,.out,.err,.crash,.dump,.trace',
          style: { display: 'none' },
          onChange: function(e) {
            var files = [];
            for (var i = 0; i < e.target.files.length; i++) files.push(e.target.files[i]);
            handleFiles(files);
          }
        })
      ),
      error ? h('div', { style: { color: '#ff8888', textAlign: 'center', marginTop: 12 } }, error) : null
    ) : h('div', null,
      h('div', { style: { marginBottom: 16, textAlign: 'right' } },
        h('button', { style: Object.assign({}, S.btn, S.btnSec), onClick: onReset }, 'Analyze New Files')
      ),
      h(Report, { results: results })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
