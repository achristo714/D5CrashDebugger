<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D5 Log Diagnostics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111114; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.5; }
    .container { max-width: 880px; margin: 0 auto; padding: 32px 20px; }
    .header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
    .header h1 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.5px; }
    .header p { font-size: 15px; color: #888; max-width: 500px; margin: 0 auto; }
    .dropzone { border: 2px dashed #3a3a44; border-radius: 16px; padding: 60px 40px; text-align: center; cursor: pointer; background: #1a1a1f; transition: all 0.2s; margin-bottom: 24px; }
    .dropzone:hover { border-color: #555; background: #1e1e24; }
    .dropzone.active { border-color: #4a9eff; background: rgba(74,158,255,0.06); }
    .dropzone .drop-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .dropzone .main-text { font-size: 17px; color: #bbb; margin-bottom: 6px; font-weight: 500; }
    .dropzone .hint { font-size: 13px; color: #555; }

    .card { background: #1c1c22; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #2a2a32; }
    .card-title { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; word-break: break-all; }
    .card-heading { font-size: 16px; font-weight: 600; color: #ddd; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #888; margin-bottom: 14px; line-height: 1.6; }
    .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat-box { background: #16161b; border-radius: 10px; padding: 14px 12px; min-width: 90px; flex: 1; text-align: center; border: 1px solid #222; }
    .stat-box .value { font-size: 26px; font-weight: 700; color: #fff; }
    .stat-box .label { font-size: 11px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge { display: inline-block; padding: 5px 14px; border-radius: 20px; color: #000; font-weight: 700; font-size: 13px; }
    .tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-right: 4px; }

    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 12px; margin-top: 28px; }

    .summary-card { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 20px 24px; }
    .summary-left { display: flex; align-items: center; gap: 14px; }
    .summary-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .summary-counts { font-size: 14px; color: #888; margin-right: 8px; }
    .file-info { font-size: 14px; color: #aaa; }

    .tab-bar { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-bar button { padding: 8px 16px; border: 1px solid #2a2a32; border-radius: 8px; background: #16161b; color: #888; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.15s; }
    .tab-bar button:hover { background: #1e1e24; color: #aaa; }
    .tab-bar button.active { color: #fff; background: #2a2a40; border-color: #4a9eff; }

    .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.15s; }
    .btn-sec { background: #2a2a32; color: #aaa; }
    .btn-sec:hover { background: #333; color: #ddd; }
    .btn-primary { background: #4a9eff; color: #fff; }
    .btn-primary:hover { background: #5aabff; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2a32; color: #666; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 8px 10px; border-bottom: 1px solid #1e1e24; color: #bbb; word-break: break-word; }
    td.ts { white-space: nowrap; color: #666; font-size: 12px; }
    pre.log { background: #111114; padding: 12px; border-radius: 8px; overflow: auto; font-size: 11px; color: #888; max-height: 180px; white-space: pre-wrap; word-break: break-word; border: 1px solid #222; margin-top: 6px; }
    .error-line { font-size: 12px; color: #bbb; padding: 6px 0; border-bottom: 1px solid #1e1e24; }
    .error-line .ts { color: #666; margin-right: 10px; font-size: 11px; }
    .error-msg { color: #ff8888; font-size: 14px; text-align: center; margin-top: 16px; }
    .loading { text-align: center; padding: 80px 20px; color: #888; }
    .loading .title { font-size: 20px; margin-bottom: 8px; color: #aaa; }
    .loading .sub { font-size: 14px; }
    .crash-item { margin-bottom: 14px; padding: 12px; background: #16161b; border-radius: 8px; border: 1px solid #222; }
    .crash-type { font-size: 13px; font-weight: 600; }
    .crash-msg { font-size: 12px; color: #999; margin: 6px 0; line-height: 1.5; }
    .top-actions { margin-bottom: 20px; text-align: right; }
    .hidden { display: none; }

    .gpu-info-bar { background: #1a1a2e; border: 1px solid #ff8c0033; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    .gpu-info-bar .gi-label { color: #ff8c00; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .gpu-info-bar .gi-value { color: #ccc; }
    .gpu-info-bar .gi-detail { color: #666; }

    .explanation-box { background: #16161b; border-radius: 8px; padding: 14px 16px; margin: 12px 0; border-left: 3px solid #4a9eff; }
    .explanation-box .ex-title { font-size: 13px; font-weight: 600; color: #ddd; margin-bottom: 4px; }
    .explanation-box .ex-text { font-size: 13px; color: #888; line-height: 1.6; }

    .step-card { background: #16161b; border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; border: 1px solid #222; }
    .step-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: #2a2a40; color: #4a9eff; font-size: 12px; font-weight: 700; margin-right: 10px; flex-shrink: 0; }
    .step-title { font-size: 14px; font-weight: 600; color: #ddd; margin-bottom: 6px; display: flex; align-items: center; }
    .step-text { font-size: 13px; color: #888; line-height: 1.6; padding-left: 34px; }
    .step-why { font-size: 12px; color: #666; margin-top: 6px; padding-left: 34px; font-style: italic; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="header">
      <h1>D5 Log Diagnostics</h1>
      <p>Drop a zip or log files to analyze crashes, errors, memory, and network issues</p>
    </div>
    <div id="upload-section">
      <div class="dropzone" id="dropzone">
        <div class="drop-icon">&#128193;</div>
        <div class="main-text">Drop your D5 log files here</div>
        <div class="hint">Supports .zip archives, .log, .txt, and other log formats &mdash; or click to browse</div>
        <input type="file" id="file-input" multiple accept=".zip,.log,.txt,.out,.err,.crash,.dump,.trace" style="display:none" />
      </div>
      <div id="error-msg" class="error-msg hidden"></div>
    </div>
    <div id="loading-section" class="loading hidden">
      <div class="title">Analyzing logs...</div>
      <div class="sub">Parsing files and detecting issues</div>
    </div>
    <div id="report-section" class="hidden"></div>
  </div>

<script>
"use strict";

// ─── Minimal Zip Reader (handles standard ZIP with deflate/stored) ──────────

var MiniZip = (function() {
  function readUint16(buf, off) { return buf[off] | (buf[off+1] << 8); }
  function readUint32(buf, off) { return (buf[off] | (buf[off+1] << 8) | (buf[off+2] << 16) | (buf[off+3] << 24)) >>> 0; }

  function inflate(data) {
    var ds = new DecompressionStream('deflate-raw');
    var writer = ds.writable.getWriter();
    writer.write(data);
    writer.close();
    var reader = ds.readable.getReader();
    var chunks = [];
    return (function read() {
      return reader.read().then(function(result) {
        if (result.done) {
          var total = 0;
          chunks.forEach(function(c) { total += c.length; });
          var out = new Uint8Array(total);
          var off = 0;
          chunks.forEach(function(c) { out.set(c, off); off += c.length; });
          return out;
        }
        chunks.push(result.value);
        return read();
      });
    })();
  }

  function parseEntries(buffer) {
    var buf = new Uint8Array(buffer);
    var entries = [];
    // Find end of central directory
    var eocdOff = -1;
    for (var i = buf.length - 22; i >= 0; i--) {
      if (readUint32(buf, i) === 0x06054b50) { eocdOff = i; break; }
    }
    if (eocdOff < 0) throw new Error('Not a valid ZIP file');

    var cdOffset = readUint32(buf, eocdOff + 16);
    var cdCount = readUint16(buf, eocdOff + 10);
    var off = cdOffset;

    for (var n = 0; n < cdCount; n++) {
      if (readUint32(buf, off) !== 0x02014b50) break;
      var method = readUint16(buf, off + 10);
      var compSize = readUint32(buf, off + 20);
      var uncompSize = readUint32(buf, off + 24);
      var nameLen = readUint16(buf, off + 28);
      var extraLen = readUint16(buf, off + 30);
      var commentLen = readUint16(buf, off + 32);
      var localOff = readUint32(buf, off + 42);
      var name = new TextDecoder().decode(buf.slice(off + 46, off + 46 + nameLen));
      entries.push({ name: name, method: method, compSize: compSize, uncompSize: uncompSize, localOff: localOff });
      off += 46 + nameLen + extraLen + commentLen;
    }
    return { entries: entries, buf: buf };
  }

  function extractEntry(zip, entry) {
    var buf = zip.buf;
    var off = entry.localOff;
    if (readUint32(buf, off) !== 0x04034b50) throw new Error('Invalid local header');
    var nameLen = readUint16(buf, off + 26);
    var extraLen = readUint16(buf, off + 28);
    var dataStart = off + 30 + nameLen + extraLen;
    var raw = buf.slice(dataStart, dataStart + entry.compSize);

    if (entry.method === 0) {
      return Promise.resolve(new TextDecoder().decode(raw));
    } else if (entry.method === 8) {
      return inflate(raw).then(function(decompressed) {
        return new TextDecoder().decode(decompressed);
      });
    } else {
      return Promise.reject(new Error('Unsupported compression method: ' + entry.method));
    }
  }

  return {
    load: function(file) {
      return file.arrayBuffer().then(function(buffer) {
        return parseEntries(buffer);
      });
    },
    extract: extractEntry
  };
})();

// ─── Parsers ────────────────────────────────────────────────────────────────

// Extract GPU adapter info from D5/Unreal Engine log text
function extractGpuInfo(text) {
  var info = {};
  var m;

  // Adapter name — various UE log formats
  m = text.match(/GRHIAdapterName\s*=\s*(.+)/i) ||
      text.match(/Chosen D3D12 Adapter[:\s]+(\d+\s*[:.]?\s*)?(.+)/i) ||
      text.match(/LogRHI.*Adapter\s*(?:Name)?\s*[:=]\s*(.+)/i) ||
      text.match(/LogD3D12RHI.*Adapter[:\s]+(.+)/i) ||
      text.match(/RHI[:\s]+(.+(?:NVIDIA|AMD|Intel|Radeon|GeForce|Arc|Quadro).+)/i);
  if (m) {
    // Take last capture group (some patterns have 2 groups)
    info.adapter = (m[m.length - 1] || '').replace(/[\[\]]/g, '').trim();
  }

  // VRAM — dedicated video memory
  m = text.match(/Dedicated Video Memory:\s*(\d+)\s*MB/i) ||
      text.match(/VRAM[:\s]+(\d+)\s*MB/i) ||
      text.match(/GRHIAdapterDedicatedVideoMemory\s*=\s*(\d+)/i) ||
      text.match(/DedicatedVideoMemory:\s*(\d+)/i);
  if (m) info.vramMB = parseInt(m[1], 10);

  // Driver version
  m = text.match(/GRHIAdapterDriverVersion\s*=\s*(.+)/i) ||
      text.match(/Driver Version[:\s]+(\S+)/i) ||
      text.match(/LogD3D12RHI.*Driver[:\s]+(\S+)/i);
  if (m) info.driverVersion = m[1].trim();

  // D3D feature level
  m = text.match(/D3D Feature Level[:\s]+([\d_]+)/i) ||
      text.match(/MaxFeatureLevel[:\s]+([\d_]+)/i);
  if (m) info.featureLevel = m[1].trim();

  // Internal resolution (RHI)
  m = text.match(/GRHIAdapterInternalDriverVersion\s*=\s*(.+)/i);
  if (m) info.internalDriverVersion = m[1].trim();

  return Object.keys(info).length > 0 ? info : null;
}
// D5-specific crash sub-type detection
function classifyCrashType(lines, startIdx) {
  // Look at surrounding context (50 lines before and after the crash trigger)
  var contextStart = Math.max(0, startIdx - 50);
  var contextEnd = Math.min(lines.length, startIdx + 100);
  var context = lines.slice(contextStart, contextEnd).join('\n');

  // GPU crash indicators
  if (/DXGI_ERROR_DEVICE_HUNG|DXGI_ERROR_DEVICE_REMOVED|DXGI_ERROR_DEVICE_RESET/i.test(context)) return 'GPU Crash';
  if (/GPU.*crash|GPU.*hang|GPU.*fault/i.test(context)) return 'GPU Crash';
  if (/LogD3D12RHI.*Error|D3D12.*failed|D3D12.*error/i.test(context)) return 'GPU Crash';
  if (/GPUBreadCrumb|GPU Breadcrumb/i.test(context)) return 'GPU Crash';
  if (/VK_ERROR_DEVICE_LOST|Vulkan.*device lost/i.test(context)) return 'GPU Crash';
  if (/CreatePlacedResource failed|Map\(Subresource.*failed/i.test(context)) return 'GPU Crash';

  // Engine crash indicators
  if (/EXCEPTION_ACCESS_VIOLATION|access violation/i.test(context)) return 'Engine Crash';
  if (/Unhandled Exception/i.test(context)) return 'Engine Crash';
  if (/Fatal error.*\[.*Line.*\]/i.test(context)) return 'Engine Crash';
  if (/Assertion failed/i.test(context)) return 'Engine Crash';
  if (/LogWindows.*Error.*Fatal/i.test(context)) return 'Engine Crash';
  if (/StaticShutdownAfterError|RequestExit/i.test(context)) return 'Engine Crash';
  if (/d5_immerse\.exe|d5render_ue5/i.test(context)) return 'Engine Crash';
  if (/\[Callstack\]/i.test(context)) return 'Engine Crash';

  // Stitching crash (sub-type of engine crash)
  if (/Stitching|StitchingMultiPartImage|FusionPhoto|CaptureActor/i.test(context)) return 'Engine Crash (Stitching)';

  return null;
}

function parseCrashLog(text) {
  var lines = text.split('\n');
  var crashes = [];
  var current = null;
  var currentStartIdx = 0;

  // Extract GPU adapter info from the full log (reported at startup)
  var gpuInfo = extractGpuInfo(text);

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    // Extract timestamp — supports both ISO and D5 bracket format [2023.09.20-06.44.18:283]
    var tsMatch = line.match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})/) ||
                  line.match(/^\[(\d{4}\.\d{2}\.\d{2}-\d{2}\.\d{2}\.\d{2}[:\.\d]*)\]/);

    // D5-specific crash triggers
    var isD5Crash = /\bFatal error\b|=== Critical error ===|\bUnhandled Exception\b/i.test(line) ||
                    /DXGI_ERROR_DEVICE_HUNG|DXGI_ERROR_DEVICE_REMOVED/i.test(line) ||
                    /GPU.*crash|GPUBreadCrumb/i.test(line);

    // General crash triggers
    var isGeneralCrash = /\b(FATAL|CRASH|SIGSEGV|SIGABRT|panic|Traceback)\b/i.test(line);

    if (isD5Crash || isGeneralCrash) {
      // Don't create duplicate crash entries for the same crash event
      if (current && i - currentStartIdx < 5) {
        // Merge into current crash — update message if this line is more specific
        if (isD5Crash) current.message = line.trim();
        continue;
      }

      current = {
        timestamp: tsMatch ? tsMatch[1] : null,
        type: null, // will be classified after context is gathered
        category: null,
        message: line.trim(),
        stack: [],
        _startIdx: i
      };
      currentStartIdx = i;
      crashes.push(current);
    } else if (current && /^\s+(at |#\d|frame|0x|\.\.\.)/.test(line)) {
      current.stack.push(line.trim());
    } else if (current && /\[Callstack\]|Callstack/i.test(line)) {
      // D5 callstack header — keep collecting
      continue;
    } else if (current && /^0x[0-9a-f]+\s/i.test(line.trim())) {
      // D5-style callstack entries: 0x00007ff6c19cc8f8 d5_immerse.exe...
      current.stack.push(line.trim());
    } else if (current && line.trim() === '') {
      // Classify before closing
      if (!current.category) {
        current.category = classifyCrashType(lines, current._startIdx);
      }
      if (!current.type) {
        current.type = current.category || (line.match(/\b(FATAL|CRASH|SIGSEGV|SIGABRT|panic|Exception|Error)\b/i) || ['Crash'])[0];
      }
      current = null;
    }
  }

  // Classify any remaining open crash
  if (current && !current.category) {
    current.category = classifyCrashType(lines, current._startIdx);
    if (!current.type) current.type = current.category || 'Crash';
  }

  // Post-process: classify all crashes that didn't get classified inline
  crashes.forEach(function(c) {
    if (!c.category) c.category = classifyCrashType(lines, c._startIdx || 0);
    if (!c.type || c.type === 'Error' || c.type === 'Crash') {
      c.type = c.category || c.type || 'Crash';
    }
    if (gpuInfo) c.gpuInfo = gpuInfo;
    delete c._startIdx;
  });

  // Attach gpuInfo to the array itself so callers can access it
  crashes.gpuInfo = gpuInfo;
  return crashes;
}

function parseSystemLog(text) {
  var lines = text.split('\n');
  var entries = [];
  var severityCounts = { ERROR: 0, WARN: 0, INFO: 0, DEBUG: 0 };
  for (var i = 0; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    var match = lines[i].match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2}[^\s]*)\s+\[?(ERROR|WARN|WARNING|INFO|DEBUG)\]?\s*(.*)/i);
    if (match) {
      var sev = match[2].toUpperCase().startsWith('WARN') ? 'WARN' : match[2].toUpperCase();
      if (severityCounts[sev] !== undefined) severityCounts[sev]++;
      entries.push({ timestamp: match[1], severity: sev, message: match[3].trim() });
    }
  }
  return { entries: entries, severityCounts: severityCounts, total: entries.length };
}

function parseMemoryLog(text) {
  var lines = text.split('\n');
  var dataPoints = [];
  var peakUsage = 0;
  for (var i = 0; i < lines.length; i++) {
    var match = lines[i].match(/(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})[^\d]*(\d+(?:\.\d+)?)\s*(MB|GB|KB|bytes)/i);
    if (match) {
      var val = parseFloat(match[2]);
      var u = match[3].toUpperCase();
      if (u === 'GB') val *= 1024;
      else if (u === 'KB') val /= 1024;
      else if (u === 'BYTES') val /= (1024 * 1024);
      if (val > peakUsage) peakUsage = val;
      dataPoints.push({ timestamp: match[1], valueMB: val });
    }
  }
  var oomEvents = (text.match(/\b(OOM|OutOfMemory|out of memory|oom-killer)\b/gi) || []).length;
  return { dataPoints: dataPoints, peakUsage: Math.round(peakUsage), oomEvents: oomEvents };
}

function parseNetworkLog(text) {
  var lines = text.split('\n');
  var errors = [];
  var timeouts = 0, connectionRefused = 0, dnsFailures = 0;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/timeout/i.test(line)) timeouts++;
    if (/connection refused/i.test(line)) connectionRefused++;
    if (/dns|resolve|NXDOMAIN/i.test(line)) dnsFailures++;
    if (/\b(error|fail|timeout|refused|unreachable)\b/i.test(line)) {
      var tsMatch = line.match(/^(\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2})/);
      errors.push({ timestamp: tsMatch ? tsMatch[1] : null, message: line.trim().slice(0, 200) });
    }
  }
  return { errors: errors.slice(0, 100), timeouts: timeouts, connectionRefused: connectionRefused, dnsFailures: dnsFailures };
}

function parseGenericLog(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  var errors = 0, warnings = 0;
  var errorLines = [];
  for (var i = 0; i < lines.length; i++) {
    if (/\berror\b/i.test(lines[i])) { errors++; errorLines.push(lines[i].trim().slice(0, 200)); }
    if (/\bwarn(ing)?\b/i.test(lines[i])) warnings++;
  }
  return { totalLines: lines.length, errors: errors, warnings: warnings, sampleErrors: errorLines.slice(0, 20) };
}

function classifyFile(name, content) {
  var lower = name.toLowerCase();
  var sample = content.slice(0, 4000);

  // Content-based detection first (most reliable)
  if (/\b(FATAL|CRASH|SIGSEGV|SIGABRT|panic|Traceback)\b/i.test(sample)) return 'crash';
  if (/\b(OOM|OutOfMemory|out of memory|oom-killer)\b/i.test(sample)) return 'memory';

  // Filename hints, but only if content looks like a log (has timestamps or severity levels)
  var looksLikeLog = /\d{4}-\d{2}-\d{2}|\b(ERROR|WARN|INFO|DEBUG|FATAL)\b/i.test(sample);

  if (looksLikeLog) {
    if (/crash|fatal|panic/i.test(lower)) return 'crash';
    if (/memory|mem|heap|oom/i.test(lower)) return 'memory';
    if (/network|net|conn|http/i.test(lower)) return 'network';
    if (/system|syslog|main/i.test(lower)) return 'system';
  }

  // Fallback: check if it has structured log lines
  if (/^\d{4}-\d{2}-\d{2}[\sT]\d{2}:\d{2}:\d{2}.*\b(ERROR|WARN|INFO|DEBUG)\b/im.test(sample)) return 'system';

  return 'generic';
}

function parseFile(name, content) {
  var type = classifyFile(name, content);
  var parsed;
  switch (type) {
    case 'crash':
      parsed = parseCrashLog(content);
      // If classified as crash but nothing found, fall back to generic
      if (parsed.length === 0) return { type: 'generic', data: parseGenericLog(content) };
      return { type: 'crash', data: parsed };
    case 'system': return { type: 'system', data: parseSystemLog(content) };
    case 'memory': return { type: 'memory', data: parseMemoryLog(content) };
    case 'network': return { type: 'network', data: parseNetworkLog(content) };
    default: return { type: 'generic', data: parseGenericLog(content) };
  }
}

function isLogFile(path) {
  // Exclude config/binary files even if path contains "log" or "crash"
  if (/\.(ini|cfg|config|dmp|exe|dll|pdb|xml|json|png|jpg|dat|db|bin)$/i.test(path)) return false;
  return /\.(log|txt|out|err|crash|trace|csv)$/i.test(path) || /log/i.test(path);
}

function processZip(file) {
  return MiniZip.load(file).then(function(zip) {
    var promises = [];
    zip.entries.forEach(function(entry) {
      if (entry.name.endsWith('/')) return;
      if (!isLogFile(entry.name)) return;
      promises.push(
        MiniZip.extract(zip, entry).then(function(content) {
          if (!content.trim()) return null;
          var parsed = parseFile(entry.name, content);
          return { path: entry.name, size: content.length, type: parsed.type, data: parsed.data, _raw: content.slice(0, 8000) };
        }).catch(function(e) {
          return { path: entry.name, type: 'error', data: { error: e.message } };
        })
      );
    });
    return Promise.all(promises).then(function(results) {
      return results.filter(function(r) { return r !== null; });
    });
  });
}

function processSingleFile(file) {
  return file.text().then(function(content) {
    if (!content.trim()) return [];
    var parsed = parseFile(file.name, content);
    return [{ path: file.name, size: content.length, type: parsed.type, data: parsed.data, _raw: content.slice(0, 8000) }];
  });
}

// ─── Severity / Report ──────────────────────────────────────────────────────

function getSeverity(results) {
  var hasCrashes = results.some(function(r) { return r.type === 'crash' && r.data.length > 0; });
  var hasOOM = results.some(function(r) { return r.type === 'memory' && r.data.oomEvents > 0; });
  var totalErrors = results.reduce(function(sum, r) {
    if (r.type === 'system') return sum + r.data.severityCounts.ERROR;
    if (r.type === 'generic') return sum + r.data.errors;
    if (r.type === 'network') return sum + r.data.errors.length;
    return sum;
  }, 0);
  if (hasCrashes || hasOOM) return { level: 'critical', color: '#ff4444', label: 'Critical' };
  if (totalErrors > 10) return { level: 'high', color: '#ff8c00', label: 'High' };
  if (totalErrors > 0) return { level: 'medium', color: '#ffd700', label: 'Medium' };
  return { level: 'low', color: '#44cc44', label: 'Low' };
}

function detectUserInfo(results) {
  var ignore = {root:1, system:1, admin:1, nobody:1, daemon:1, lib:1, bin:1, local:1, share:1, tmp:1, var:1, etc:1, default:1, public:1, '':1, appdata:1, program:1, windows:1};

  // Path patterns that capture both username and the full path
  var pathPatterns = [
    { re: /C:\\Users\\([a-zA-Z0-9._-]+)\\[^\s\n"]*/gi, type: 'win' },
    { re: /\/home\/([a-zA-Z0-9._-]+)\/[^\s\n"]*/g, type: 'linux' },
    { re: /\/Users\/([a-zA-Z0-9._-]+)\/[^\s\n"]*/g, type: 'mac' }
  ];

  var candidates = {};   // username -> count
  var userPaths = {};     // username -> Set of full paths seen

  function scanText(text) {
    pathPatterns.forEach(function(pp) {
      var m;
      pp.re.lastIndex = 0;
      while ((m = pp.re.exec(text)) !== null) {
        var name = m[1];
        var nameLower = name.toLowerCase();
        if (ignore[nameLower]) continue;
        candidates[nameLower] = (candidates[nameLower] || 0) + 1;
        if (!userPaths[nameLower]) userPaths[nameLower] = {};
        // Store a cleaned-up version of the path (first ~120 chars)
        var fullPath = m[0].slice(0, 120);
        userPaths[nameLower][fullPath] = true;
      }
    });
  }

  results.forEach(function(f) {
    if (f.type === 'error') return;
    // Scan the zip entry path itself
    scanText(f.path);
    // Scan raw file content (first 8KB stored during processing)
    if (f._raw) scanText(f._raw);
  });

  // Find the most common username
  var best = null, bestCount = 0;
  Object.keys(candidates).forEach(function(name) {
    if (candidates[name] > bestCount) { best = name; bestCount = candidates[name]; }
  });

  if (!best) return { username: null, userPath: null };

  // Pick the most representative path (shortest unique home/user dir)
  var paths = Object.keys(userPaths[best] || {});
  // Find the user's home directory
  var homePath = null;
  paths.forEach(function(p) {
    var homeMatch = p.match(/^(C:\\Users\\[^\\]+|\/home\/[^\/]+|\/Users\/[^\/]+)/i);
    if (homeMatch && (!homePath || homeMatch[1].length < homePath.length)) {
      homePath = homeMatch[1];
    }
  });

  return { username: best, userPath: homePath || paths[0] || null };
}

function computeTotals(results) {
  var totalCrashes = results.filter(function(f) { return f.type === 'crash'; }).reduce(function(s, f) { return s + f.data.length; }, 0);
  var totalErrors = results.reduce(function(sum, f) {
    if (f.type === 'system') return sum + f.data.severityCounts.ERROR;
    if (f.type === 'generic') return sum + f.data.errors;
    if (f.type === 'network') return sum + f.data.errors.length;
    return sum;
  }, 0);
  var totalWarnings = results.reduce(function(sum, f) {
    if (f.type === 'system') return sum + f.data.severityCounts.WARN;
    if (f.type === 'generic') return sum + f.data.warnings;
    return sum;
  }, 0);
  var oomCount = results.filter(function(f) { return f.type === 'memory'; }).reduce(function(s, f) { return s + f.data.oomEvents; }, 0);
  return { totalCrashes: totalCrashes, totalErrors: totalErrors, totalWarnings: totalWarnings, oomCount: oomCount };
}

function buildFindings(results) {
  var findings = [];

  results.filter(function(f) { return f.type === 'crash' && f.data.length > 0; }).forEach(function(f) {
    var types = {};
    f.data.forEach(function(c) {
      var t = c.category || c.type || 'Unknown';
      if (!types[t]) types[t] = { count: 0, first: c };
      types[t].count++;
    });
    Object.keys(types).forEach(function(t) {
      var info = types[t];
      var friendlyType = /GPU/i.test(t) ? 'Graphics card crash' : /Stitching/i.test(t) ? 'Panorama stitching crash' : /Engine/i.test(t) ? 'D5 engine crash' : 'Application crash';
      var detail = info.first.message;
      if (/GPU/i.test(t) && info.first.gpuInfo) {
        var gi = info.first.gpuInfo;
        var parts = [];
        if (gi.adapter) parts.push('GPU: ' + gi.adapter);
        if (gi.vramMB) parts.push('VRAM: ' + (gi.vramMB >= 1024 ? (gi.vramMB / 1024).toFixed(0) + ' GB' : gi.vramMB + ' MB'));
        if (gi.driverVersion) parts.push('Driver: ' + gi.driverVersion);
        if (parts.length) detail += '\n' + parts.join(' | ');
      }
      findings.push({
        priority: 1, icon: 'Crash',
        title: friendlyType + ' (' + info.count + 'x) in ' + f.path,
        detail: detail,
        stack: info.first.stack.slice(0, 3).join('\n         ')
      });
    });
  });

  results.filter(function(f) { return f.type === 'memory' && f.data.oomEvents > 0; }).forEach(function(f) {
    findings.push({
      priority: 1, icon: 'Memory',
      title: 'Ran out of memory (' + f.data.oomEvents + ' time' + (f.data.oomEvents !== 1 ? 's' : '') + ')',
      detail: 'The application used up all available memory. Peak usage: ' + f.data.peakUsage + ' MB'
    });
  });

  results.filter(function(f) { return f.type === 'network'; }).forEach(function(f) {
    var d = f.data;
    var issues = [];
    if (d.timeouts > 0) issues.push(d.timeouts + ' timeout' + (d.timeouts !== 1 ? 's' : ''));
    if (d.connectionRefused > 0) issues.push(d.connectionRefused + ' refused connection' + (d.connectionRefused !== 1 ? 's' : ''));
    if (d.dnsFailures > 0) issues.push(d.dnsFailures + ' DNS failure' + (d.dnsFailures !== 1 ? 's' : ''));
    if (issues.length > 0) {
      findings.push({
        priority: 2, icon: 'Network',
        title: 'Network problems detected in ' + f.path,
        detail: issues.join(', ')
      });
    }
  });

  results.filter(function(f) { return f.type === 'system' && f.data.severityCounts.ERROR > 5; }).forEach(function(f) {
    var topErrors = {};
    f.data.entries.filter(function(e) { return e.severity === 'ERROR'; }).forEach(function(e) {
      var key = e.message.slice(0, 80);
      if (!topErrors[key]) topErrors[key] = 0;
      topErrors[key]++;
    });
    var sorted = Object.keys(topErrors).sort(function(a, b) { return topErrors[b] - topErrors[a]; });
    findings.push({
      priority: 2, icon: 'Errors',
      title: f.data.severityCounts.ERROR + ' errors found in ' + f.path,
      detail: 'Most frequent: ' + sorted.slice(0, 3).map(function(k) { return '"' + k + '" (' + topErrors[k] + 'x)'; }).join(', ')
    });
  });

  findings.sort(function(a, b) { return a.priority - b.priority; });
  return findings;
}

function buildNextSteps(results, totalCrashes, totalErrors, oomCount) {
  var steps = [];

  if (totalCrashes > 0) {
    var crashCategories = {};
    results.filter(function(f) { return f.type === 'crash'; }).forEach(function(f) {
      f.data.forEach(function(c) {
        var cat = c.category || c.type || 'Unknown';
        crashCategories[cat] = (crashCategories[cat] || 0) + 1;
      });
    });
    var catKeys = Object.keys(crashCategories);

    if (catKeys.some(function(t) { return /GPU/i.test(t); })) {
      var gpuCount = catKeys.reduce(function(s, t) { return /GPU/i.test(t) ? s + crashCategories[t] : s; }, 0);
      var gpuInfo = null;
      results.filter(function(f) { return f.type === 'crash'; }).some(function(f) {
        if (f.data.gpuInfo) { gpuInfo = f.data.gpuInfo; return true; }
        return f.data.some(function(c) { if (c.gpuInfo) { gpuInfo = c.gpuInfo; return true; } return false; });
      });
      var gpuTitle = 'GPU Crash Detected (' + gpuCount + 'x)';
      if (gpuInfo && gpuInfo.adapter) gpuTitle += ' \u2014 ' + gpuInfo.adapter;
      steps.push({
        title: gpuTitle,
        text: 'The graphics card stopped responding while D5 was rendering. This error (DXGI_ERROR_DEVICE_HUNG) means the GPU either ran out of video memory (VRAM) or took too long to complete a rendering task.' +
          (gpuInfo && gpuInfo.vramMB ? ' This system has ' + (gpuInfo.vramMB >= 1024 ? (gpuInfo.vramMB / 1024).toFixed(0) + ' GB' : gpuInfo.vramMB + ' MB') + ' of VRAM.' : ''),
        actions: [
          'Try reducing texture quality or render resolution in D5 settings',
          'Simplify the scene by hiding or removing heavy assets temporarily',
          'Make sure your GPU drivers are up to date' + (gpuInfo && gpuInfo.driverVersion ? ' (current: ' + gpuInfo.driverVersion + ')' : ''),
          'Forward these log files to the D5 support team for further analysis'
        ],
        why: 'GPU crashes are the most common type of D5 crash. They happen when the scene demands more from the graphics card than it can handle.'
      });
    }

    if (catKeys.some(function(t) { return /Stitching/i.test(t); })) {
      var stitchCount = catKeys.reduce(function(s, t) { return /Stitching/i.test(t) ? s + crashCategories[t] : s; }, 0);
      steps.push({
        title: 'Crash During Panorama Stitching (' + stitchCount + 'x)',
        text: 'D5 crashed while combining multiple camera captures into a single panoramic image. The stitching engine (FusionPhoto/CaptureActor) encountered an error it could not recover from.',
        actions: [
          'Try rendering the panorama at a lower resolution first',
          'Check if the scene has extremely complex geometry near the camera',
          'Forward these log files to the D5 team so they can reproduce and fix this'
        ],
        why: 'Stitching crashes are usually triggered by specific scene setups. The D5 team needs the logs to identify what combination of settings caused the issue.'
      });
    }

    if (catKeys.some(function(t) { return /^Engine Crash$/i.test(t); })) {
      var engCount = crashCategories['Engine Crash'] || 0;
      steps.push({
        title: 'D5 Engine Crash (' + engCount + 'x)',
        text: 'The D5 application encountered an internal error (access violation or unhandled exception) and had to shut down. This is a software bug in the engine, not something caused by your hardware.',
        actions: [
          'Note what you were doing right before the crash (this helps the D5 team)',
          'Check if the crash happens consistently with the same project or action',
          'Forward these log files to the D5 support team for investigation'
        ],
        why: 'Engine crashes are bugs in the D5 software itself. The callstack information in the crash details helps developers pinpoint exactly where the error occurred.'
      });
    }

    if (catKeys.some(function(t) { return /SIGSEGV|SIGABRT/i.test(t); })) {
      steps.push({
        title: 'System Signal Crash',
        text: 'A low-level system signal (SIGSEGV/SIGABRT) was detected, which usually means the application tried to access invalid memory.',
        actions: ['Review the stack trace in the crash details', 'Check for recent software updates that may have introduced the issue'],
        why: 'These crashes indicate a serious software bug that needs developer attention.'
      });
    }

    if (catKeys.some(function(t) { return /panic/i.test(t); })) {
      steps.push({
        title: 'Application Panic',
        text: 'An unrecoverable runtime error was detected. The application stopped itself because it reached a state it could not handle safely.',
        actions: ['Review the panic stack trace for the failing component', 'Forward logs to the development team'],
        why: 'Panics are safety mechanisms that prevent worse problems like data corruption.'
      });
    }
  }

  if (oomCount > 0) {
    var peakMB = results.filter(function(f) { return f.type === 'memory'; }).reduce(function(max, f) { return Math.max(max, f.data.peakUsage); }, 0);
    steps.push({
      title: 'Out of Memory (' + oomCount + ' event' + (oomCount !== 1 ? 's' : '') + ')',
      text: 'D5 tried to use more system memory (RAM) than was available. Peak memory usage reached ' + peakMB + ' MB. When the system runs out of memory, applications crash.',
      actions: [
        'Close other memory-heavy applications before running D5',
        'Reduce scene complexity or number of assets loaded simultaneously',
        'Consider upgrading system RAM if this happens frequently'
      ],
      why: 'Large D5 scenes with many high-resolution textures and complex models can consume significant amounts of RAM.'
    });
  }

  var netResults = results.filter(function(f) { return f.type === 'network'; });
  var totalTimeouts = netResults.reduce(function(s, f) { return s + f.data.timeouts; }, 0);
  var totalRefused = netResults.reduce(function(s, f) { return s + f.data.connectionRefused; }, 0);
  var totalDns = netResults.reduce(function(s, f) { return s + f.data.dnsFailures; }, 0);

  if (totalRefused > 0) steps.push({
    title: 'Connection Refused (' + totalRefused + 'x)',
    text: 'D5 tried to connect to an online service but the connection was refused. This usually means the service is temporarily down or a firewall is blocking the connection.',
    actions: ['Check your internet connection', 'Verify firewall or antivirus is not blocking D5', 'Try again later in case the service was temporarily unavailable'],
    why: 'D5 connects to online services for asset downloads, license verification, and updates.'
  });

  if (totalTimeouts > 0) steps.push({
    title: 'Network Timeouts (' + totalTimeouts + 'x)',
    text: 'D5 waited too long for a response from an online service. This can happen with slow or unstable internet connections.',
    actions: ['Check your internet connection speed and stability', 'Try connecting to a different network if available'],
    why: 'Timeouts mean the server did not respond within the expected time window.'
  });

  if (totalDns > 0) steps.push({
    title: 'DNS Resolution Failures (' + totalDns + 'x)',
    text: 'D5 could not look up the address of an online service. DNS translates website names into network addresses.',
    actions: ['Check your internet connection', 'Try restarting your router', 'Contact your network administrator if on a corporate network'],
    why: 'DNS failures prevent D5 from reaching any online services, even if your internet is otherwise working.'
  });

  if (totalErrors > 10 && totalCrashes === 0 && oomCount === 0) {
    steps.push({
      title: 'Multiple Errors Detected (' + totalErrors + ' total)',
      text: 'While no crashes were found, a significant number of errors appeared across the log files. These may indicate underlying issues that could eventually lead to problems.',
      actions: ['Review the error details in the file cards below', 'Look for repeating patterns that might point to a single root cause', 'Forward logs to D5 support if errors are affecting your workflow'],
      why: 'A high error count can signal configuration problems, compatibility issues, or intermittent failures.'
    });
  }

  return steps;
}

function formatStepAsText(step) {
  var text = step.title + ' \u2014 ' + step.text;
  if (step.actions && step.actions.length) {
    text += '\n     Actions: ' + step.actions.join('; ');
  }
  return text;
}

function generateTextReport(results, severity, meta) {
  var r = '';
  var line = '────────────────────────────────────────────────────────────\n';
  var now = new Date();
  var t = computeTotals(results);

  // Header
  r += line;
  r += '  D5 LOG DIAGNOSTICS REPORT\n';
  r += '  ' + now.toLocaleDateString() + ' ' + now.toLocaleTimeString() + '\n';
  if (meta.username) r += '  User:    ' + meta.username + '\n';
  if (meta.userPath) r += '  Path:    ' + meta.userPath + '\n';
  if (meta.sourceFiles && meta.sourceFiles.length) {
    r += '  Source:  ' + meta.sourceFiles.join(', ') + '\n';
  }
  r += line + '\n';

  r += 'SUMMARY\n';
  r += '  Severity:   ' + severity.label.toUpperCase() + '\n';
  r += '  Files:      ' + results.length + ' analyzed\n';
  r += '  Crashes:    ' + t.totalCrashes + '\n';
  r += '  Errors:     ' + t.totalErrors + '\n';
  r += '  Warnings:   ' + t.totalWarnings + '\n';
  if (t.oomCount > 0) r += '  OOM Events: ' + t.oomCount + '\n';
  r += '\n';

  var findings = buildFindings(results);
  if (findings.length > 0) {
    r += 'KEY FINDINGS\n';
    findings.forEach(function(f, i) {
      r += '\n  ' + (i + 1) + '. [' + f.icon + '] ' + f.title + '\n';
      if (f.detail) r += '     ' + f.detail + '\n';
      if (f.stack) r += '         ' + f.stack + '\n';
    });
    r += '\n';
  }

  r += line;
  r += 'RECOMMENDED NEXT STEPS\n\n';
  var steps = buildNextSteps(results, t.totalCrashes, t.totalErrors, t.oomCount);
  if (steps.length > 0) {
    steps.forEach(function(s, i) {
      r += '  ' + (i + 1) + '. ' + formatStepAsText(s) + '\n\n';
    });
  } else {
    r += '  No critical issues found. System appears healthy.\n';
    if (t.totalWarnings > 0) {
      r += '  Consider reviewing ' + t.totalWarnings + ' warnings for potential future issues.\n';
    }
    r += '\n';
  }

  r += line;
  r += 'FILE DETAILS\n\n';
  results.forEach(function(f) {
    r += '  ' + f.path + ' [' + f.type + ']\n';
    switch (f.type) {
      case 'crash': r += '    ' + f.data.length + ' crashes\n'; break;
      case 'system': r += '    ' + f.data.total + ' entries, ' + f.data.severityCounts.ERROR + ' errors, ' + f.data.severityCounts.WARN + ' warnings\n'; break;
      case 'memory': r += '    Peak ' + f.data.peakUsage + ' MB, ' + f.data.oomEvents + ' OOM events\n'; break;
      case 'network': r += '    ' + f.data.errors.length + ' errors, ' + f.data.timeouts + ' timeouts, ' + f.data.connectionRefused + ' refused, ' + f.data.dnsFailures + ' DNS\n'; break;
      case 'generic': r += '    ' + f.data.totalLines + ' lines, ' + f.data.errors + ' errors, ' + f.data.warnings + ' warnings\n'; break;
    }
  });
  r += '\n' + line;
  return r;
}

// ─── DOM Rendering ──────────────────────────────────────────────────────────

var $ = function(id) { return document.getElementById(id); };

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderStatBox(value, label) {
  return '<div class="stat-box"><div class="value">' + esc(String(value)) + '</div><div class="label">' + esc(label) + '</div></div>';
}

function crashTagColor(category) {
  if (/GPU/i.test(category)) return { bg: '#ff8c0022', fg: '#ff8c00' };
  if (/Engine/i.test(category)) return { bg: '#ff444422', fg: '#ff4444' };
  return { bg: '#ff444422', fg: '#ff4444' };
}

function renderCrashCard(f) {
  var categories = {};
  f.data.forEach(function(c) {
    var cat = c.category || c.type || 'Crash';
    categories[cat] = (categories[cat] || 0) + 1;
  });

  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span><span>';
  Object.keys(categories).forEach(function(cat) {
    var col = crashTagColor(cat);
    html += '<span class="tag" style="background:' + col.bg + ';color:' + col.fg + '">' + categories[cat] + ' ' + esc(cat) + '</span> ';
  });
  html += '</span></div>';

  var hasGpu = Object.keys(categories).some(function(c) { return /GPU/i.test(c); });
  var hasStitching = Object.keys(categories).some(function(c) { return /Stitching/i.test(c); });

  if (hasGpu) {
    html += '<div class="card-heading">Graphics Card Issue Detected</div>';
    html += '<div class="card-desc">D5 reported a problem with the GPU (graphics card). This usually means the graphics card ran out of memory or became unresponsive while rendering. This is one of the most common D5 crash types.</div>';
  } else if (hasStitching) {
    html += '<div class="card-heading">Crash During Image Stitching</div>';
    html += '<div class="card-desc">D5 crashed while combining multiple images into a panorama. This is typically caused by specific scene configurations that trigger an error in the stitching process.</div>';
  } else {
    html += '<div class="card-heading">Application Crash Detected</div>';
    html += '<div class="card-desc">D5 encountered an unexpected error that caused it to stop working. The details below can help identify the root cause.</div>';
  }

  var gpuInfo = f.data.gpuInfo || (f.data.length > 0 && f.data[0].gpuInfo);
  if (hasGpu && gpuInfo) {
    html += '<div class="gpu-info-bar">';
    html += '<span class="gi-label">GPU Info</span>';
    if (gpuInfo.adapter) html += '<span class="gi-value">' + esc(gpuInfo.adapter) + '</span>';
    if (gpuInfo.vramMB) html += '<span class="gi-detail">VRAM: ' + (gpuInfo.vramMB >= 1024 ? (gpuInfo.vramMB / 1024).toFixed(1) + ' GB' : gpuInfo.vramMB + ' MB') + '</span>';
    if (gpuInfo.driverVersion) html += '<span class="gi-detail">Driver: ' + esc(gpuInfo.driverVersion) + '</span>';
    if (gpuInfo.featureLevel) html += '<span class="gi-detail">D3D: ' + esc(gpuInfo.featureLevel) + '</span>';
    html += '</div>';
  }

  f.data.slice(0, 10).forEach(function(c) {
    var col = crashTagColor(c.category || c.type);
    html += '<div class="crash-item">';
    html += '<div class="crash-type" style="color:' + col.fg + '">';
    html += esc(c.category || c.type);
    if (c.timestamp) html += ' <span style="color:#888;font-weight:400">@ ' + esc(c.timestamp) + '</span>';
    html += '</div>';
    html += '<div class="crash-msg">' + esc(c.message) + '</div>';
    if (c.stack.length) html += '<pre class="log">' + esc(c.stack.join('\n')) + '</pre>';
    html += '</div>';
  });
  return html + '</div>';
}

function renderSystemCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="card-heading">System Log</div>';
  html += '<div class="card-desc">This file contains structured application messages. ' + (d.severityCounts.ERROR > 0 ? d.severityCounts.ERROR + ' error' + (d.severityCounts.ERROR !== 1 ? 's' : '') + ' found that may need attention.' : 'No errors found.') + '</div>';
  html += '<div class="stat-row">' + renderStatBox(d.total, 'Total') + renderStatBox(d.severityCounts.ERROR, 'Errors') + renderStatBox(d.severityCounts.WARN, 'Warnings') + '</div>';
  if (d.severityCounts.ERROR > 0) {
    html += '<div style="font-size:12px;color:#888;margin-bottom:4px">Recent errors:</div>';
    html += '<table><thead><tr><th>Time</th><th>Message</th></tr></thead><tbody>';
    d.entries.filter(function(e) { return e.severity === 'ERROR'; }).slice(0, 10).forEach(function(e) {
      html += '<tr><td class="ts">' + esc(e.timestamp) + '</td><td>' + esc(e.message) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  return html + '</div>';
}

function renderMemoryCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="card-heading">Memory Usage</div>';
  if (d.oomEvents > 0) {
    html += '<div class="card-desc">D5 ran out of available memory ' + d.oomEvents + ' time' + (d.oomEvents !== 1 ? 's' : '') + '. Out-of-memory events cause crashes and are usually caused by very large scenes or too many high-resolution assets loaded at once.</div>';
  } else {
    html += '<div class="card-desc">This file tracks how much memory D5 used over time. Peak usage reached ' + d.peakUsage + ' MB. No out-of-memory events were detected.</div>';
  }
  html += '<div class="stat-row">' + renderStatBox(d.peakUsage + ' MB', 'Peak Usage') + renderStatBox(d.oomEvents, 'OOM Events') + renderStatBox(d.dataPoints.length, 'Data Points') + '</div>';
  if (d.oomEvents > 0) html += '<span class="tag" style="background:#ff444422;color:#ff4444">Out of Memory Detected</span>';
  return html + '</div>';
}

function renderNetworkCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="card-heading">Network Activity</div>';
  var issues = [];
  if (d.timeouts > 0) issues.push(d.timeouts + ' timeout' + (d.timeouts !== 1 ? 's' : ''));
  if (d.connectionRefused > 0) issues.push(d.connectionRefused + ' refused connection' + (d.connectionRefused !== 1 ? 's' : ''));
  if (d.dnsFailures > 0) issues.push(d.dnsFailures + ' DNS failure' + (d.dnsFailures !== 1 ? 's' : ''));
  if (issues.length > 0) {
    html += '<div class="card-desc">Network problems were detected: ' + issues.join(', ') + '. These can indicate internet connectivity issues, firewall restrictions, or D5 online services being temporarily unavailable.</div>';
  } else {
    html += '<div class="card-desc">This file contains network-related log entries. No significant connection problems were found.</div>';
  }
  html += '<div class="stat-row">' + renderStatBox(d.errors.length, 'Errors') + renderStatBox(d.timeouts, 'Timeouts') + renderStatBox(d.connectionRefused, 'Refused') + renderStatBox(d.dnsFailures, 'DNS Failures') + '</div>';
  if (d.errors.length > 0) {
    html += '<div style="font-size:12px;color:#888;margin-bottom:4px">Recent errors:</div>';
    d.errors.slice(0, 10).forEach(function(e) {
      html += '<div class="error-line">';
      if (e.timestamp) html += '<span class="ts">' + esc(e.timestamp) + '</span>';
      html += esc(e.message) + '</div>';
    });
  }
  return html + '</div>';
}

function renderGenericCard(f) {
  var d = f.data;
  var html = '<div class="card"><div class="card-title"><span>' + esc(f.path) + '</span></div>';
  html += '<div class="card-heading">Log File</div>';
  if (d.errors > 0) {
    html += '<div class="card-desc">This log contains ' + d.totalLines + ' lines with ' + d.errors + ' error' + (d.errors !== 1 ? 's' : '') + ' and ' + d.warnings + ' warning' + (d.warnings !== 1 ? 's' : '') + '. Sample errors shown below.</div>';
  } else {
    html += '<div class="card-desc">This log contains ' + d.totalLines + ' lines. No errors were detected.</div>';
  }
  html += '<div class="stat-row">' + renderStatBox(d.totalLines, 'Lines') + renderStatBox(d.errors, 'Errors') + renderStatBox(d.warnings, 'Warnings') + '</div>';
  if (d.sampleErrors.length > 0) html += '<pre class="log">' + esc(d.sampleErrors.slice(0, 5).join('\n')) + '</pre>';
  return html + '</div>';
}

function renderFileCard(f) {
  if (f.type === 'error') {
    return '<div class="card"><div class="card-title">' + esc(f.path) + '</div><div style="color:#ff8888;font-size:13px">Parse error: ' + esc(f.data.error) + '</div></div>';
  }
  switch (f.type) {
    case 'crash': return renderCrashCard(f);
    case 'system': return renderSystemCard(f);
    case 'memory': return renderMemoryCard(f);
    case 'network': return renderNetworkCard(f);
    default: return renderGenericCard(f);
  }
}

var currentResults = null;
var currentSeverity = null;
var currentSourceFiles = [];
var activeTab = 'all';

function renderReport(results) {
  currentResults = results;
  currentSeverity = getSeverity(results);
  activeTab = 'all';

  var types = ['all'];
  var seen = {};
  results.forEach(function(r) { if (!seen[r.type]) { seen[r.type] = true; types.push(r.type); } });

  var t = computeTotals(results);

  var html = '<div class="top-actions"><button class="btn btn-sec" onclick="resetApp()">Analyze New Files</button></div>';

  // Summary card
  html += '<div class="card summary-card">';
  html += '<div class="summary-left"><span class="badge" style="background:' + currentSeverity.color + '">' + esc(currentSeverity.label) + '</span>';
  html += '<span class="file-info">' + results.length + ' file' + (results.length !== 1 ? 's' : '') + ' analyzed</span></div>';
  html += '<div class="summary-right"><span class="summary-counts">' + t.totalCrashes + ' crash' + (t.totalCrashes !== 1 ? 'es' : '') + ' &middot; ' + t.totalErrors + ' error' + (t.totalErrors !== 1 ? 's' : '') + '</span>';
  html += '<button class="btn btn-sec" onclick="exportTxt()">Export TXT</button> ';
  html += '<button class="btn btn-primary" onclick="exportPdf()">Export Report</button></div></div>';

  // User info if detected
  var userInfo = detectUserInfo(results);
  if (userInfo.username) {
    html += '<div style="font-size:13px;color:#888;margin-bottom:16px;padding:0 4px">Device user: <strong style="color:#bbb">' + esc(userInfo.username) + '</strong>';
    if (userInfo.userPath) html += ' &mdash; <code style="font-size:12px;color:#666">' + esc(userInfo.userPath) + '</code>';
    html += '</div>';
  }

  // Key Findings section
  var findings = buildFindings(results);
  if (findings.length > 0) {
    html += '<div class="section-label">What We Found</div>';
    findings.forEach(function(f) {
      var borderColor = f.priority === 1 ? '#ff4444' : '#ff8c00';
      html += '<div class="explanation-box" style="border-left-color:' + borderColor + '">';
      html += '<div class="ex-title">' + esc(f.icon) + ' &mdash; ' + esc(f.title) + '</div>';
      if (f.detail) html += '<div class="ex-text">' + esc(f.detail) + '</div>';
      html += '</div>';
    });
  }

  // Next Steps section
  var steps = buildNextSteps(results, t.totalCrashes, t.totalErrors, t.oomCount);
  if (steps.length > 0) {
    html += '<div class="section-label">Recommended Next Steps</div>';
    steps.forEach(function(s, i) {
      html += '<div class="step-card">';
      html += '<div class="step-title"><span class="step-num">' + (i + 1) + '</span>' + esc(s.title) + '</div>';
      html += '<div class="step-text">' + esc(s.text) + '</div>';
      if (s.actions && s.actions.length) {
        html += '<ul style="margin:8px 0 0 34px;padding:0;font-size:13px;color:#aaa">';
        s.actions.forEach(function(a) { html += '<li style="margin-bottom:4px">' + esc(a) + '</li>'; });
        html += '</ul>';
      }
      if (s.why) html += '<div class="step-why">Why: ' + esc(s.why) + '</div>';
      html += '</div>';
    });
  } else if (t.totalCrashes === 0 && t.oomCount === 0) {
    html += '<div class="section-label">Assessment</div>';
    html += '<div class="explanation-box"><div class="ex-title">No critical issues found</div>';
    html += '<div class="ex-text">The log files look healthy. No crashes or out-of-memory events were detected.' + (t.totalWarnings > 0 ? ' There are ' + t.totalWarnings + ' warnings that you may want to review, but they are typically informational.' : '') + '</div></div>';
  }

  // File Details section
  html += '<div class="section-label">File Details</div>';

  // Tabs
  html += '<div class="tab-bar" id="tab-bar">';
  types.forEach(function(tp) {
    var count = tp === 'all' ? results.length : results.filter(function(r) { return r.type === tp; }).length;
    var label = tp === 'all' ? 'All' : tp.charAt(0).toUpperCase() + tp.slice(1);
    var cls = tp === 'all' ? 'active' : '';
    html += '<button class="' + cls + '" data-tab="' + tp + '" onclick="switchTab(\'' + tp + '\')">' + label + ' (' + count + ')</button>';
  });
  html += '</div>';

  // Cards
  html += '<div id="cards-container">';
  results.forEach(function(f) { html += renderFileCard(f); });
  html += '</div>';

  $('report-section').innerHTML = html;
  $('report-section').classList.remove('hidden');
}

function switchTab(tab) {
  activeTab = tab;
  var filtered = tab === 'all' ? currentResults : currentResults.filter(function(r) { return r.type === tab; });
  var html = '';
  filtered.forEach(function(f) { html += renderFileCard(f); });
  document.getElementById('cards-container').innerHTML = html;

  var buttons = document.querySelectorAll('#tab-bar button');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].className = buttons[i].getAttribute('data-tab') === tab ? 'active' : '';
  }
}

function getExportMeta() {
  var info = detectUserInfo(currentResults);
  return { username: info.username || 'unknown', userPath: info.userPath, sourceFiles: currentSourceFiles };
}

function exportTxt() {
  var text = generateTextReport(currentResults, currentSeverity, getExportMeta());
  var blob = new Blob([text], { type: 'text/plain' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'd5-diagnostics-' + Date.now() + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function exportPdf() {
  var meta = getExportMeta();
  var severity = currentSeverity;
  var results = currentResults;
  var now = new Date();
  var t = computeTotals(results);
  var totalCrashes = t.totalCrashes, totalErrors = t.totalErrors, totalWarnings = t.totalWarnings, oomCount = t.oomCount;

  // Build styled HTML for print
  var h = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>D5 Diagnostics Report</title><style>';
  h += 'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;margin:40px;font-size:12px;line-height:1.5}';
  h += 'h1{font-size:22px;margin:0 0 2px;color:#111}';
  h += '.meta{color:#666;font-size:11px;margin-bottom:4px}';
  h += '.sep{border-top:2px solid #222;margin:16px 0}';
  h += '.sep-light{border-top:1px solid #ccc;margin:12px 0}';
  h += 'h2{font-size:15px;margin:16px 0 8px;color:#111;text-transform:uppercase;letter-spacing:0.5px}';
  h += '.badge{display:inline-block;padding:3px 10px;border-radius:10px;color:#fff;font-weight:700;font-size:11px}';
  h += '.stats{display:flex;gap:24px;margin:8px 0 16px}';
  h += '.stat{text-align:center}.stat .val{font-size:22px;font-weight:700;color:#111}.stat .lbl{font-size:10px;color:#888;text-transform:uppercase}';
  h += '.finding{margin-bottom:10px;padding:8px 12px;border-left:3px solid #ccc;background:#f8f8f8}';
  h += '.finding.p1{border-left-color:#e53e3e}.finding.p2{border-left-color:#dd6b20}';
  h += '.finding-title{font-weight:600;font-size:12px}.finding-detail{font-size:11px;color:#555;margin-top:2px}';
  h += '.step{margin-bottom:10px}.step-num{font-weight:700;color:#2b6cb0}.step-text{color:#333}';
  h += '.file-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;font-size:11px}';
  h += '.file-name{font-weight:600;color:#333}.file-stats{color:#888}';
  h += 'pre{background:#f5f5f5;padding:8px;border-radius:4px;font-size:10px;overflow:hidden;white-space:pre-wrap;word-break:break-word}';
  h += 'table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}';
  h += 'th{text-align:left;padding:4px 6px;border-bottom:2px solid #ccc;color:#666;font-size:10px;text-transform:uppercase}';
  h += 'td{padding:4px 6px;border-bottom:1px solid #eee}';
  h += '@media print{body{margin:20px}@page{margin:15mm;size:A4}}';
  h += '</style></head><body>';

  // Header
  h += '<h1>D5 Log Diagnostics Report</h1>';
  h += '<div class="meta">' + now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
  if (meta.username) h += ' &nbsp;|&nbsp; User: <strong>' + esc(meta.username) + '</strong>';
  if (meta.userPath) h += ' &nbsp;|&nbsp; Path: <code>' + esc(meta.userPath) + '</code>';
  if (meta.sourceFiles.length) h += '<br>Source: ' + esc(meta.sourceFiles.join(', '));
  h += '</div>';
  h += '<div class="sep"></div>';

  // Summary
  h += '<h2>Summary</h2>';
  h += '<div><span class="badge" style="background:' + severity.color + '">' + esc(severity.label) + '</span></div>';
  h += '<div class="stats">';
  h += '<div class="stat"><div class="val">' + results.length + '</div><div class="lbl">Files</div></div>';
  h += '<div class="stat"><div class="val">' + totalCrashes + '</div><div class="lbl">Crashes</div></div>';
  h += '<div class="stat"><div class="val">' + totalErrors + '</div><div class="lbl">Errors</div></div>';
  h += '<div class="stat"><div class="val">' + totalWarnings + '</div><div class="lbl">Warnings</div></div>';
  if (oomCount > 0) h += '<div class="stat"><div class="val" style="color:#e53e3e">' + oomCount + '</div><div class="lbl">OOM Events</div></div>';
  h += '</div>';

  // Key Findings
  var findings = buildFindings(results);
  if (findings.length > 0) {
    h += '<div class="sep-light"></div>';
    h += '<h2>Key Findings</h2>';
    findings.forEach(function(f) {
      h += '<div class="finding p' + f.priority + '">';
      h += '<div class="finding-title">' + esc(f.icon + ' ' + f.title) + '</div>';
      if (f.detail) h += '<div class="finding-detail">' + esc(f.detail) + '</div>';
      if (f.stack) h += '<pre>' + esc(f.stack) + '</pre>';
      h += '</div>';
    });
  }

  // Next Steps
  var steps = buildNextSteps(results, totalCrashes, totalErrors, oomCount);
  if (steps.length > 0) {
    h += '<div class="sep"></div>';
    h += '<h2>Recommended Next Steps</h2>';
    steps.forEach(function(s, i) {
      h += '<div class="step" style="margin-bottom:14px;padding:10px 12px;background:#f8f8f8;border-radius:6px">';
      h += '<div style="font-weight:700;font-size:12px;margin-bottom:4px"><span class="step-num">' + (i + 1) + '.</span> ' + esc(s.title) + '</div>';
      h += '<div class="step-text" style="font-size:11px;color:#444;margin-bottom:6px">' + esc(s.text) + '</div>';
      if (s.actions && s.actions.length) {
        h += '<ul style="margin:0 0 4px 16px;padding:0;font-size:11px;color:#555">';
        s.actions.forEach(function(a) { h += '<li style="margin-bottom:2px">' + esc(a) + '</li>'; });
        h += '</ul>';
      }
      if (s.why) h += '<div style="font-size:10px;color:#888;font-style:italic;margin-top:4px">Why: ' + esc(s.why) + '</div>';
      h += '</div>';
    });
  }

  // File Details
  h += '<div class="sep"></div>';
  h += '<h2>File Details</h2>';

  results.forEach(function(f) {
    var detail = '';
    switch (f.type) {
      case 'crash': detail = f.data.length + ' crashes'; break;
      case 'system': detail = f.data.total + ' entries, ' + f.data.severityCounts.ERROR + ' errors, ' + f.data.severityCounts.WARN + ' warnings'; break;
      case 'memory': detail = 'Peak ' + f.data.peakUsage + ' MB, ' + f.data.oomEvents + ' OOM'; break;
      case 'network': detail = f.data.errors.length + ' errors, ' + f.data.timeouts + ' timeouts'; break;
      case 'generic': detail = f.data.totalLines + ' lines, ' + f.data.errors + ' errors'; break;
      default: detail = f.type;
    }
    h += '<div class="file-row"><span class="file-name">' + esc(f.path) + ' <span style="color:#aaa;font-weight:400">[' + f.type + ']</span></span><span class="file-stats">' + esc(detail) + '</span></div>';
  });

  // Crash details appendix
  var crashFiles = results.filter(function(f) { return f.type === 'crash' && f.data.length > 0; });
  if (crashFiles.length > 0) {
    h += '<div class="sep"></div>';
    h += '<h2>Crash Details</h2>';
    // Show GPU adapter info in PDF if available
    var pdfGpuInfo = null;
    crashFiles.some(function(f) {
      if (f.data.gpuInfo) { pdfGpuInfo = f.data.gpuInfo; return true; }
      return f.data.some(function(c) { if (c.gpuInfo) { pdfGpuInfo = c.gpuInfo; return true; } return false; });
    });
    if (pdfGpuInfo) {
      h += '<div style="background:#f0f0f0;border:1px solid #ddd;border-radius:4px;padding:6px 10px;margin-bottom:8px;font-size:11px">';
      h += '<strong>GPU Adapter:</strong> ';
      if (pdfGpuInfo.adapter) h += esc(pdfGpuInfo.adapter);
      if (pdfGpuInfo.vramMB) h += ' &nbsp;|&nbsp; VRAM: ' + (pdfGpuInfo.vramMB >= 1024 ? (pdfGpuInfo.vramMB / 1024).toFixed(1) + ' GB' : pdfGpuInfo.vramMB + ' MB');
      if (pdfGpuInfo.driverVersion) h += ' &nbsp;|&nbsp; Driver: ' + esc(pdfGpuInfo.driverVersion);
      if (pdfGpuInfo.featureLevel) h += ' &nbsp;|&nbsp; D3D FL: ' + esc(pdfGpuInfo.featureLevel);
      h += '</div>';
    }
    crashFiles.forEach(function(f) {
      h += '<div style="font-weight:600;margin:8px 0 4px;font-size:11px;color:#666">' + esc(f.path) + '</div>';
      f.data.slice(0, 10).forEach(function(c) {
        var catColor = /GPU/i.test(c.category) ? '#dd6b20' : '#e53e3e';
        var catLabel = c.category || c.type || 'Crash';
        h += '<div style="margin-bottom:8px">';
        h += '<div style="font-weight:600;color:' + catColor + ';font-size:11px">' + esc(catLabel) + (c.timestamp ? ' <span style="color:#888;font-weight:400">@ ' + esc(c.timestamp) + '</span>' : '') + '</div>';
        h += '<div style="font-size:11px;color:#444">' + esc(c.message) + '</div>';
        if (c.stack.length) h += '<pre>' + esc(c.stack.join('\n')) + '</pre>';
        h += '</div>';
      });
    });
  }

  // Error details appendix
  var sysFiles = results.filter(function(f) { return f.type === 'system' && f.data.severityCounts.ERROR > 0; });
  if (sysFiles.length > 0) {
    h += '<div class="sep"></div>';
    h += '<h2>Error Log Details</h2>';
    sysFiles.forEach(function(f) {
      h += '<div style="font-weight:600;margin:8px 0 4px">' + esc(f.path) + '</div>';
      h += '<table><thead><tr><th>Time</th><th>Message</th></tr></thead><tbody>';
      f.data.entries.filter(function(e) { return e.severity === 'ERROR'; }).slice(0, 15).forEach(function(e) {
        h += '<tr><td style="white-space:nowrap;color:#888">' + esc(e.timestamp) + '</td><td>' + esc(e.message) + '</td></tr>';
      });
      h += '</tbody></table>';
    });
  }

  h += '</body></html>';

  // Download as HTML file — user can open and print/save as PDF
  var blob = new Blob([h], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'd5-diagnostics-' + (meta.username || 'report') + '-' + Date.now() + '.html';
  a.click();
  URL.revokeObjectURL(url);
}

function resetApp() {
  currentResults = null;
  currentSeverity = null;
  currentSourceFiles = [];
  $('report-section').classList.add('hidden');
  $('report-section').innerHTML = '';
  $('upload-section').classList.remove('hidden');
  $('error-msg').classList.add('hidden');
  $('file-input').value = '';
}

function handleFiles(files) {
  if (!files.length) return;
  currentSourceFiles = [];
  for (var j = 0; j < files.length; j++) currentSourceFiles.push(files[j].name);
  $('upload-section').classList.add('hidden');
  $('error-msg').classList.add('hidden');
  $('loading-section').classList.remove('hidden');

  var chain = Promise.resolve([]);
  for (var i = 0; i < files.length; i++) {
    (function(file) {
      chain = chain.then(function(all) {
        if (/\.zip$/i.test(file.name)) {
          return processZip(file).then(function(r) { return all.concat(r); });
        } else {
          return processSingleFile(file).then(function(r) { return all.concat(r); });
        }
      });
    })(files[i]);
  }

  chain.then(function(allResults) {
    $('loading-section').classList.add('hidden');
    if (allResults.length === 0) {
      $('upload-section').classList.remove('hidden');
      $('error-msg').textContent = 'No log files found. Supported: .log, .txt, .out, .err, .crash, .dump, .trace';
      $('error-msg').classList.remove('hidden');
    } else {
      renderReport(allResults);
    }
  }).catch(function(e) {
    $('loading-section').classList.add('hidden');
    $('upload-section').classList.remove('hidden');
    $('error-msg').textContent = 'Failed to process files: ' + e.message;
    $('error-msg').classList.remove('hidden');
  });
}

// ─── Event Listeners ────────────────────────────────────────────────────────

var dropzone = $('dropzone');
var fileInput = $('file-input');

dropzone.addEventListener('click', function() { fileInput.click(); });
dropzone.addEventListener('dragover', function(e) { e.preventDefault(); dropzone.classList.add('active'); });
dropzone.addEventListener('dragleave', function() { dropzone.classList.remove('active'); });
dropzone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropzone.classList.remove('active');
  var files = [];
  for (var i = 0; i < e.dataTransfer.files.length; i++) files.push(e.dataTransfer.files[i]);
  handleFiles(files);
});
fileInput.addEventListener('change', function(e) {
  var files = [];
  for (var i = 0; i < e.target.files.length; i++) files.push(e.target.files[i]);
  handleFiles(files);
});
</script>
